<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate of Change from a Graph</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}
.page{max-width:900px;margin:28px auto;padding:0 18px}
h1{margin:0 0 8px;font-size:30px}
.subtitle{font-size:17px;color:#444;margin-bottom:18px}
.topbar{display:flex;justify-content:flex-end;margin-bottom:18px}
.score{font-size:17px}
.problem-box{border:1.5px solid #111;padding:22px}
.question{font-size:20px;font-weight:700;margin-bottom:10px}
#graph{width:100%;height:380px;display:block;margin:8px 0 18px}
.choices{display:grid;grid-template-columns:1fr;gap:10px}
.choice{border:1.5px solid #111;padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;background:#fff}
.choice:hover{background:#f2f2f2}
.choice input{transform:scale(1.15);margin:0}
.choice-letter{font-weight:700;min-width:24px}
.choice-math{font-family:"Times New Roman",Times,serif;font-size:24px;display:inline-flex;align-items:center}
.frac{display:inline-flex;flex-direction:column;align-items:stretch;text-align:center;line-height:1.05;min-width:120px}
.frac .num{border-bottom:1.7px solid #111;padding:0 7px 4px}
.frac .den{padding:4px 7px 0}
.button-row{margin-top:18px}
button{font-size:17px;padding:11px 18px;border:1.5px solid #111;background:#fff;cursor:pointer}
button:hover{background:#ededed}
#feedback{min-height:30px;margin-top:16px;font-size:19px;font-weight:700}
.correct{color:#16752b}
.incorrect{color:#b52222}
#errorBox{display:none;margin:12px 0;padding:10px;border:1px solid #b52222;color:#b52222;font-family:monospace;white-space:pre-wrap}
@media(max-width:650px){
  .page{padding:0 12px;margin-top:18px}
  .problem-box{padding:16px}
  h1{font-size:27px}
  #graph{height:310px}
  .choice-math{font-size:21px}
}
</style>
</head>
<body>
<div class="page">
  <h1>Rate of Change from a Graph</h1>
  <div class="subtitle">Choose the correct setup from the graph. Do not simplify.</div>
  <div class="topbar"><div class="score">Score: <span id="correctCount">0</span> / <span id="attemptCount">0</span></div></div>

  <div class="problem-box">
    <div class="question" id="promptText">Loading problem...</div>
    <div id="errorBox"></div>
    <svg id="graph" viewBox="0 0 800 380" aria-label="coordinate graph"></svg>

    <form class="choices">
      <label class="choice"><input type="radio" name="choice" value="0"><span class="choice-letter">A.</span><span class="choice-math" id="choice0"></span></label>
      <label class="choice"><input type="radio" name="choice" value="1"><span class="choice-letter">B.</span><span class="choice-math" id="choice1"></span></label>
      <label class="choice"><input type="radio" name="choice" value="2"><span class="choice-letter">C.</span><span class="choice-math" id="choice2"></span></label>
      <label class="choice"><input type="radio" name="choice" value="3"><span class="choice-letter">D.</span><span class="choice-math" id="choice3"></span></label>
    </form>

    <div class="button-row"><button id="actionButton" type="button">Check Answer</button></div>
    <div id="feedback"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var currentProblem = null;
  var answered = false;
  var correctCount = 0;
  var attemptCount = 0;

  var svg = document.getElementById("graph");
  var promptText = document.getElementById("promptText");
  var feedback = document.getElementById("feedback");
  var actionButton = document.getElementById("actionButton");
  var errorBox = document.getElementById("errorBox");

  var G_LEFT = 70;
  var G_RIGHT = 760;
  var G_TOP = 25;
  var G_BOTTOM = 330;
  var X_MIN = -6;
  var X_MAX = 6;
  var Y_MIN = -6;
  var Y_MAX = 6;

  function showError(err) {
    errorBox.style.display = "block";
    errorBox.textContent = "Error: " + (err && err.message ? err.message : String(err));
  }

  function randInt(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
  }

  function shuffle(arr){
    var copy=arr.slice();
    for(var i=copy.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var tmp=copy[i]; copy[i]=copy[j]; copy[j]=tmp;
    }
    return copy;
  }

  function svgEl(type, attrs){
    var e=document.createElementNS("http://www.w3.org/2000/svg",type);
    Object.keys(attrs || {}).forEach(function(k){ e.setAttribute(k,attrs[k]); });
    return e;
  }

  function xPx(x){
    return G_LEFT + (x-X_MIN)*(G_RIGHT-G_LEFT)/(X_MAX-X_MIN);
  }

  function yPx(y){
    return G_BOTTOM - (y-Y_MIN)*(G_BOTTOM-G_TOP)/(Y_MAX-Y_MIN);
  }

  function subtraction(first,second){
    return second < 0 ? first + "- (" + second + ")" : first + "- " + second;
  }

  function fractionHTML(n1,n2,d1,d2){
    return '<span class="frac"><span class="num">' +
      subtraction(n1,n2) +
      '</span><span class="den">' +
      subtraction(d1,d2) +
      '</span></span>';
  }

  function generateProblem(){
    var xs=[-5,-3,-1,1,3,5];
    var ys=[];

    while(ys.length<xs.length){
      var y=randInt(-5,5);
      if(ys.indexOf(y)===-1) ys.push(y);
    }

    var i1,i2;
    do{
      i1=randInt(0,xs.length-1);
      i2=randInt(0,xs.length-1);
    }while(i1===i2 || Math.abs(i1-i2)<2);

    var leftIndex=Math.min(i1,i2);
    var rightIndex=Math.max(i1,i2);

    var a=xs[leftIndex];
    var b=xs[rightIndex];
    var fA=ys[leftIndex];
    var fB=ys[rightIndex];

    var choices=[
      {n1:fA,n2:fB,d1:a,d2:b,correct:true},
      {n1:a,n2:b,d1:fA,d2:fB,correct:false},
      {n1:fA,n2:fB,d1:b,d2:a,correct:false},
      {n1:a,n2:fA,d1:b,d2:fB,correct:false}
    ];

    return {
      xs:xs, ys:ys, a:a, b:b, fA:fA, fB:fB,
      leftIndex:leftIndex, rightIndex:rightIndex,
      choices:shuffle(choices)
    };
  }

  function addText(x,y,text,attrs){
    var a=attrs || {};
    a.x=x; a.y=y;
    var t=svgEl("text",a);
    t.textContent=text;
    svg.appendChild(t);
  }

  function drawGraph(p){
    svg.innerHTML="";

    var x,y,px,py;

    for(x=X_MIN;x<=X_MAX;x++){
      px=xPx(x);
      svg.appendChild(svgEl("line",{
        x1:px,y1:G_TOP,x2:px,y2:G_BOTTOM,
        stroke:x===0?"#111":"#ddd",
        "stroke-width":x===0?2:1
      }));
    }

    for(y=Y_MIN;y<=Y_MAX;y++){
      py=yPx(y);
      svg.appendChild(svgEl("line",{
        x1:G_LEFT,y1:py,x2:G_RIGHT,y2:py,
        stroke:y===0?"#111":"#ddd",
        "stroke-width":y===0?2:1
      }));
    }

    for(x=X_MIN;x<=X_MAX;x++){
      if(x!==0){
        addText(xPx(x),yPx(0)+22,String(x),{
          "text-anchor":"middle","font-size":14,"font-family":"Arial"
        });
      }
    }

    for(y=Y_MIN;y<=Y_MAX;y++){
      if(y!==0){
        addText(xPx(0)-12,yPx(y)+5,String(y),{
          "text-anchor":"end","font-size":14,"font-family":"Arial"
        });
      }
    }

    var points=[];
    for(var i=0;i<p.xs.length;i++){
      points.push(xPx(p.xs[i]) + "," + yPx(p.ys[i]));
    }

    svg.appendChild(svgEl("polyline",{
      points:points.join(" "),
      fill:"none",
      stroke:"#111",
      "stroke-width":4,
      "stroke-linejoin":"round",
      "stroke-linecap":"round"
    }));

    for(i=0;i<p.xs.length;i++){
      svg.appendChild(svgEl("circle",{
        cx:xPx(p.xs[i]),cy:yPx(p.ys[i]),r:5,fill:"#111"
      }));
    }


  }

  function renderChoices(p){
    var radios=document.querySelectorAll('input[name="choice"]');
    p.choices.forEach(function(choice,i){
      document.getElementById("choice"+i).innerHTML=
        fractionHTML(choice.n1,choice.n2,choice.d1,choice.d2);
      radios[i].checked=false;
      radios[i].dataset.correct=choice.correct?"true":"false";
    });
  }

  function newProblem(){
    try{
      errorBox.style.display="none";
      errorBox.textContent="";
      currentProblem=generateProblem();
      answered=false;
      feedback.textContent="";
      feedback.className="";
      actionButton.textContent="Check Answer";
      promptText.textContent="Find the average rate of change on ["+currentProblem.a+", "+currentProblem.b+"].";
      drawGraph(currentProblem);
      renderChoices(currentProblem);
    }catch(err){
      showError(err);
    }
  }

  function checkAnswer(){
    if(answered) return;

    var selected=document.querySelector('input[name="choice"]:checked');

    if(!selected){
      feedback.textContent="Select an answer choice first.";
      feedback.className="incorrect";
      return;
    }

    answered=true;
    attemptCount++;

    if(selected.dataset.correct==="true"){
      correctCount++;
      feedback.textContent="Correct!";
      feedback.className="correct";
    }else{
      feedback.textContent="Not quite.";
      feedback.className="incorrect";
    }

    document.getElementById("correctCount").textContent=correctCount;
    document.getElementById("attemptCount").textContent=attemptCount;
    actionButton.textContent="New Question";
  }

  actionButton.addEventListener("click",function(){
    if(answered) newProblem();
    else checkAnswer();
  });

  document.addEventListener("keydown",function(e){
    if(e.key==="Enter"){
      e.preventDefault();
      if(answered) newProblem();
      else checkAnswer();
    }
  });

  newProblem();
})();
</script>
</body>
</html>
