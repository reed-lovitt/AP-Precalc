<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate of Change Patterns from a Table</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}
.page{max-width:900px;margin:28px auto;padding:0 18px}
h1{margin:0 0 8px;font-size:30px}
.subtitle{font-size:17px;color:#444;margin-bottom:18px}
.topbar{display:flex;justify-content:flex-end;margin-bottom:18px}
.score{font-size:17px}
.problem-box{border:1.5px solid #111;padding:22px}
.question{font-size:20px;font-weight:700;margin-bottom:12px}
.table-wrap{display:flex;justify-content:center;margin:16px 0 22px;overflow-x:auto}
table{border-collapse:collapse;font-size:21px;min-width:390px;text-align:center}
th,td{border:1.5px solid #111;padding:11px 18px;min-width:74px}
th{font-weight:700;background:#fafafa}
.choices{display:grid;grid-template-columns:1fr;gap:10px}
.choice{border:1.5px solid #111;padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;background:#fff}
.choice:hover{background:#f2f2f2}
.choice input{transform:scale(1.15);margin:0}
.choice-letter{font-weight:700;min-width:24px}
.choice-text{font-size:20px}
.button-row{margin-top:18px}
button{font-size:17px;padding:11px 18px;border:1.5px solid #111;background:#fff;cursor:pointer}
button:hover{background:#ededed}
#feedback{min-height:30px;margin-top:16px;font-size:19px;font-weight:700}
.correct{color:#16752b}
.incorrect{color:#b52222}
@media(max-width:650px){
  .page{padding:0 12px;margin-top:18px}
  .problem-box{padding:16px}
  h1{font-size:27px}
  th,td{padding:9px 12px;min-width:62px}
}

/* Shared answer-choice polish */
.choices{gap:12px !important}
.choice,label.choice{
  border:1.25px solid #222 !important;
  border-radius:9px !important;
  padding:12px 14px !important;
  min-height:60px;
  background:#fff !important;
  align-items:center !important;
}
.choice:hover,label.choice:hover{background:#f7f7f7 !important}
.choice input{margin:0 2px 0 0}
.choice-letter{min-width:24px;font-weight:700}
.choice-text,.choice-value,.choice-math{line-height:1.3}
.choice-math,.choice-text mjx-container,.choice-math mjx-container{
  font-size:1.08em !important;
}
mjx-container{margin:0 !important}


.math-head{
  font-family:"Cambria Math","Times New Roman",serif;
  font-weight:400;
  font-size:1.05em;
}
</style>
<script>
window.MathJax={tex:{inlineMath:[['\\(','\\)']]},chtml:{scale:1}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
<div class="page">
  <h1>Rate of Change Patterns from a Table</h1>
  <div class="subtitle">Use equal-length intervals to recognize rate-of-change patterns and function type.</div>

  <div class="topbar">
    <div class="score">Score: <span id="correctCount">0</span> / <span id="attemptCount">0</span></div>
  </div>

  <div class="problem-box">
    <div class="question" id="promptText"></div>
    <div class="table-wrap" id="tableWrap"></div>

    <form class="choices">
      <label class="choice"><input type="radio" name="choice" value="0"><span class="choice-letter">A.</span><span class="choice-text" id="choice0"></span></label>
      <label class="choice"><input type="radio" name="choice" value="1"><span class="choice-letter">B.</span><span class="choice-text" id="choice1"></span></label>
      <label class="choice"><input type="radio" name="choice" value="2"><span class="choice-letter">C.</span><span class="choice-text" id="choice2"></span></label>
    </form>

    <div class="button-row"><button id="actionButton" type="button">Check Answer</button></div>
    <div id="feedback"></div>
  </div>
</div>

<script>
(function(){
function typesetMath(target){
  function run(){
    if(window.MathJax && MathJax.typesetPromise){
      MathJax.typesetPromise(target ? [target] : undefined);
    }
  }
  if(window.MathJax && MathJax.startup && MathJax.startup.promise){
    MathJax.startup.promise.then(run);
  }else{
    setTimeout(run,100);
  }
}
"use strict";

var currentProblem=null;
var answered=false;
var correctCount=0;
var attemptCount=0;

function randInt(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}
function pick(arr){
  return arr[randInt(0,arr.length-1)];
}
function shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

function makeXs(){
  var h=pick([1,2,3]);
  var start=randInt(-8,2);
  return [0,1,2,3,4].map(function(i){return start+i*h;});
}

function buildLinear(){
  var xs=makeXs();
  var y0=randInt(-10,10);
  var diff;
  do{ diff=randInt(-6,6); }while(diff===0);

  var ys=[y0];
  for(var i=1;i<5;i++) ys.push(ys[i-1]+diff);

  return {xs:xs,ys:ys,type:"Linear",rocTrend:"Constant"};
}

function buildQuadratic(forceTrend){
  var xs=makeXs();
  var y0=randInt(-8,8);
  var first=randInt(-5,5);
  var second;

  if(forceTrend==="Increasing"){
    second=pick([1,2,3,4]);
  }else if(forceTrend==="Decreasing"){
    second=-pick([1,2,3,4]);
  }else{
    second=pick([-4,-3,-2,-1,1,2,3,4]);
  }

  var ys=[y0];
  var d=first;
  for(var i=1;i<5;i++){
    ys.push(ys[i-1]+d);
    d+=second;
  }

  return {
    xs:xs,
    ys:ys,
    type:"Quadratic",
    rocTrend:second>0 ? "Increasing" : "Decreasing"
  };
}

function buildNeither(){
  var xs=makeXs();
  var y0=randInt(-8,8);

  // Deliberately nonconstant first differences and nonconstant second differences.
  var diffs;
  do{
    diffs=[
      randInt(-6,6),
      randInt(-6,6),
      randInt(-6,6),
      randInt(-6,6)
    ];
    var seconds=[
      diffs[1]-diffs[0],
      diffs[2]-diffs[1],
      diffs[3]-diffs[2]
    ];
    var firstConstant=diffs.every(function(v){return v===diffs[0];});
    var secondConstant=seconds.every(function(v){return v===seconds[0];});
  }while(firstConstant || secondConstant);

  var ys=[y0];
  for(var i=0;i<diffs.length;i++) ys.push(ys[ys.length-1]+diffs[i]);

  return {xs:xs,ys:ys,type:"Neither",rocTrend:null};
}

function makeProblem(){
  var mode=Math.random()<0.5 ? "roc" : "type";
  var data,choices,prompt;

  if(mode==="roc"){
    // Only use patterns that cleanly fit the requested three ROC categories.
    var trend=pick(["Constant","Increasing","Decreasing"]);
    if(trend==="Constant") data=buildLinear();
    else data=buildQuadratic(trend);

    prompt="The average rates of change over consecutive equal-length intervals are:";
    choices=shuffle([
      {text:"Constant",correct:data.rocTrend==="Constant"},
      {text:"Increasing",correct:data.rocTrend==="Increasing"},
      {text:"Decreasing",correct:data.rocTrend==="Decreasing"}
    ]);
  }else{
    var kind=pick(["Linear","Quadratic","Neither"]);
    if(kind==="Linear") data=buildLinear();
    else if(kind==="Quadratic") data=buildQuadratic();
    else data=buildNeither();

    prompt="The data in the table are most consistent with which type of function?";
    choices=shuffle([
      {text:"Linear",correct:data.type==="Linear"},
      {text:"Quadratic",correct:data.type==="Quadratic"},
      {text:"Neither",correct:data.type==="Neither"}
    ]);
  }

  data.mode=mode;
  data.prompt=prompt;
  data.choices=choices;
  data.orientation=Math.random()<0.5 ? "horizontal" : "vertical";
  return data;
}

function renderTable(p){
  var wrap=document.getElementById("tableWrap");
  var html="";

  if(p.orientation==="horizontal"){
    html='<table><tr><th><span class='math-head'><i>x</i></span></th>';
    p.xs.forEach(function(x){html+='<td>'+x+'</td>';});
    html+='</tr><tr><th><span class='math-head'><i>f</i>(<i>x</i>)</span></th>';
    p.ys.forEach(function(y){html+='<td>'+y+'</td>';});
    html+='</tr></table>';
  }else{
    html='<table><tr><th><span class='math-head'><i>x</i></span></th><th><span class='math-head'><i>f</i>(<i>x</i>)</span></th></tr>';
    for(var i=0;i<p.xs.length;i++){
      html+='<tr><td>'+p.xs[i]+'</td><td>'+p.ys[i]+'</td></tr>';
    }
    html+='</table>';
  }

  wrap.innerHTML=html;
}

function renderChoices(p){
  var radios=document.querySelectorAll('input[name="choice"]');
  p.choices.forEach(function(c,i){
    document.getElementById("choice"+i).textContent=c.text;
    radios[i].checked=false;
    radios[i].dataset.correct=c.correct ? "true" : "false";
  });
}

function newProblem(){
  currentProblem=makeProblem();
  answered=false;
  document.getElementById("feedback").textContent="";
  document.getElementById("feedback").className="";
  document.getElementById("actionButton").textContent="Check Answer";
  document.getElementById("promptText").textContent=currentProblem.prompt;
  renderTable(currentProblem);
  renderChoices(currentProblem);
}

function checkAnswer(){
  if(answered) return;

  var selected=document.querySelector('input[name="choice"]:checked');
  var feedback=document.getElementById("feedback");

  if(!selected){
    feedback.textContent="Select an answer choice first.";
    feedback.className="incorrect";
    return;
  }

  answered=true;
  attemptCount++;

  if(selected.dataset.correct==="true"){
    correctCount++;
    feedback.textContent="Correct!";
    feedback.className="correct";
  }else{
    feedback.textContent="Not quite.";
    feedback.className="incorrect";
  }

  document.getElementById("correctCount").textContent=correctCount;
  document.getElementById("attemptCount").textContent=attemptCount;
  document.getElementById("actionButton").textContent="New Question";
}

document.getElementById("actionButton").addEventListener("click",function(){
  if(answered) newProblem();
  else checkAnswer();
});

document.addEventListener("keydown",function(e){
  if(e.key==="Enter"){
    e.preventDefault();
    if(answered) newProblem();
    else checkAnswer();
  }
});

newProblem();
})();
</script>
</body>
</html>
