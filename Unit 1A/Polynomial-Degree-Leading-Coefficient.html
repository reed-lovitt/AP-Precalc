<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polynomial Degree and Leading Coefficient Practice</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}
.page{max-width:940px;margin:26px auto 40px;padding:0 20px}
.header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:18px}
h1{margin:0 0 5px;font-size:29px}
.subtitle{font-size:16px;color:#555}
.right-status{display:flex;align-items:center;gap:18px;white-space:nowrap}
.clock{font-size:15px;color:#444;text-align:right;line-height:1.15}
.score{font-size:17px;white-space:nowrap}
.card{border:1.4px solid #111;padding:24px 26px 26px}
.prompt{font-size:19px;line-height:1.5;margin-bottom:22px}
.choices{display:grid;gap:12px}
.choice{
  border:1.25px solid #222;
  border-radius:9px;
  min-height:62px;
  padding:12px 15px 12px 11px;
  display:grid;
  grid-template-columns:42px 1fr;
  align-items:center;
  background:#fff;
  cursor:pointer;
}
.choice:hover{background:#f7f7f7}
.choice input{position:absolute;opacity:0;pointer-events:none}
.badge{
  width:24px;height:24px;border:1.2px solid #444;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700
}
.choice.selected{box-shadow:inset 0 0 0 1.4px #111}
.choice.selected .badge{background:#111;color:#fff}
.choice-text{font-size:18px;line-height:1.4}
.choice-text mjx-container,.prompt mjx-container{margin:0 !important}
.controls{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:18px}
button{font-size:16px;padding:10px 17px;border:1.25px solid #111;background:#fff;cursor:pointer}
button:hover{background:#f2f2f2}
#feedback{min-height:24px;font-size:18px;font-weight:700}
.correct{color:#1f7a31}
.incorrect{color:#b52222}
@media(max-width:650px){
  .page{padding:0 12px;margin-top:14px}
  .header{align-items:flex-start}
  .card{padding:17px}
  h1{font-size:25px}
  .prompt{font-size:17px}
  .choice-text{font-size:17px}
}
</style>
<script>
window.MathJax={
  tex:{inlineMath:[['\\(','\\)']]},
  chtml:{scale:1}
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
<div class="page">
  <div class="header">
    <div>
      <h1>Polynomial Degree and Leading Coefficient Practice</h1>
      <div class="subtitle">Determine degree and leading coefficient from factored form.</div>
    </div>
    <div class="right-status">
      <div class="clock"><span id="dateDisplay"></span> <span id="timeDisplay"></span></div>
      <div class="score">Score: <span id="correctCount">0</span> / 5</div>
    </div>
  </div>

  <div class="card">
    <div class="prompt" id="promptText"></div>
    <form class="choices" id="choices"></form>
    <div class="controls">
      <button id="actionButton" type="button">Check Answer</button>
      <div id="feedback"></div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

var answered=false;
var correctCount=0;
var attemptCount=0;
function updateClock(){
  var now=new Date();
  document.getElementById("dateDisplay").textContent=(now.getMonth()+1)+"/"+now.getDate();
  document.getElementById("timeDisplay").textContent=now.toLocaleTimeString(undefined,{
    hour:"numeric",minute:"2-digit",second:"2-digit"
  });
}
updateClock();
setInterval(updateClock,1000);

var current=null;

function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function pick(a){return a[randInt(0,a.length-1)]}
function shuffle(a){
  a=a.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}
function signedTerm(n){
  return n<0 ? " - "+Math.abs(n) : " + "+n;
}
function linearFactor(a,b){
  if(a===1) return "(x"+signedTerm(b)+")";
  return "("+a+"x"+signedTerm(b)+")";
}
function irreducibleQuadratic(){
  // x^2 + bx + c with negative discriminant.
  while(true){
    var b=randInt(-5,5);
    var c=randInt(1,8);
    if(b*b-4*c<0){
      var s="x^2";
      if(b!==0) s+=b<0 ? " - "+Math.abs(b)+"x" : " + "+b+"x";
      s+=" + "+c;
      return {tex:"("+s+")",lead:1,degree:2};
    }
  }
}
function makeProblem(){
  // Repeated linear factor is almost always multiplicity 2; multiplicity 3 is rare.
  var mult=Math.random()<0.08 ? 3 : 2;

  // Make the repeated factor sometimes have a non-unit x coefficient so the
  // leading coefficient requires actually using the exponent.
  var a=pick([1,1,2,2,3,4]);
  var b;
  do{b=randInt(-6,6)}while(b===0);

  var factors=[{tex:linearFactor(a,b)+"^{"+mult+"}",lead:Math.pow(a,mult),degree:mult}];

  // About 40% include an irreducible quadratic factor.
  var hasQuadratic=Math.random()<0.40;
  if(hasQuadratic){
    factors.push(irreducibleQuadratic());
  }else{
    var a2=pick([1,1,1,2,3]);
    var b2;
    do{b2=randInt(-7,7)}while(b2===0);
    factors.push({tex:linearFactor(a2,b2),lead:a2,degree:1});
  }

  // Occasionally add one more simple linear factor so degree is not too predictable.
  if(Math.random()<0.28){
    var a3=pick([1,1,2]);
    var b3;
    do{b3=randInt(-7,7)}while(b3===0);
    factors.push({tex:linearFactor(a3,b3),lead:a3,degree:1});
  }

  var outside=pick([1,1,1,2,3,-1,-2]);
  var degree=factors.reduce(function(s,f){return s+f.degree},0);
  var lc=outside*factors.reduce(function(p,f){return p*f.lead},1);

  var tex=(outside===1?"":outside===-1?"-":String(outside))+
          factors.map(function(f){return f.tex}).join("");

  // Build a 2x2 AP-style distractor set:
  // correct degree vs one degree too low, and correct LC vs a common LC mistake.
  var wrongDegree=Math.max(1,degree-1);

  // Common mistake: don't apply multiplicity to repeated factor's leading term.
  var wrongLC=outside*a;
  for(var i=1;i<factors.length;i++) wrongLC*=factors[i].lead;
  if(wrongLC===lc){
    wrongLC=outside*factors.reduce(function(p,f){return p*f.lead},1);
    wrongLC += lc>0 ? -1 : 1;
    if(wrongLC===lc) wrongLC=lc+1;
  }

  var answers=shuffle([
    {degree:wrongDegree,lc:wrongLC,correct:false},
    {degree:wrongDegree,lc:lc,correct:false},
    {degree:degree,lc:wrongLC,correct:false},
    {degree:degree,lc:lc,correct:true}
  ]);

  return {tex:tex,degree:degree,lc:lc,answers:answers};
}
function answerText(a){
  return "The polynomial has degree "+a.degree+" and a leading coefficient of "+a.lc+".";
}
function renderChoices(p){
  var form=document.getElementById("choices");
  form.innerHTML="";
  var letters=["A","B","C","D"];
  p.answers.forEach(function(a,i){
    var label=document.createElement("label");
    label.className="choice";
    label.innerHTML="<input type='radio' name='choice' value='"+i+"'>"+
      "<span class='badge'>"+letters[i]+"</span>"+
      "<span class='choice-text'>"+answerText(a)+"</span>";
    label.querySelector("input").dataset.correct=a.correct?"true":"false";
    label.addEventListener("click",function(){
      document.querySelectorAll(".choice").forEach(function(el){el.classList.remove("selected")});
      label.classList.add("selected");
    });
    form.appendChild(label);
  });
}
function typeset(target){
  if(window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([target]);
}
function newProblem(){
  answered=false;
  current=makeProblem();
  document.getElementById("feedback").textContent="";
  document.getElementById("feedback").className="";
  document.getElementById("actionButton").textContent="Check Answer";

  document.getElementById("promptText").innerHTML=
    "The polynomial function \\(f\\) is given by \\(f(x)="+current.tex+"\\). "+
    "Which of the following descriptions of \\(f\\) is true?";

  renderChoices(current);
  typeset(document.querySelector(".card"));
}
function checkAnswer(){
  if(answered)return;
  var selected=document.querySelector("input[name='choice']:checked");
  var feedback=document.getElementById("feedback");
  if(!selected){
    feedback.textContent="Select an answer choice first.";
    feedback.className="incorrect";
    return;
  }
  answered=true;
  if(selected.dataset.correct==="true"){
    correctCount=Math.min(5,correctCount+1);
    feedback.textContent="Correct!";
    feedback.className="correct";
  }else{
    correctCount=0;
    feedback.textContent="Not quite. Score reset to 0.";
    feedback.className="incorrect";
  }
  document.getElementById("correctCount").textContent=correctCount;
  document.getElementById("actionButton").textContent="New Question";
}
document.getElementById("actionButton").addEventListener("click",function(){
  answered?newProblem():checkAnswer();
});
newProblem();
})();
</script>
</body>
</html>
