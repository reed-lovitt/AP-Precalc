<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concavity and Rate of Change Intervals</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}
.page{max-width:940px;margin:26px auto 40px;padding:0 20px}
.header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:18px}
h1{margin:0 0 5px;font-size:29px}
.subtitle{font-size:16px;color:#555}
.right-status{display:flex;align-items:center;gap:18px;white-space:nowrap}
.clock{font-size:15px;color:#444}
.score{font-size:17px}
.card{border:1.4px solid #111;padding:22px 24px 24px}
.graph-title{text-align:center;font-family:"Times New Roman",serif;font-size:18px;margin-bottom:3px}
.graph-wrap{display:flex;justify-content:center;margin:0 auto 18px}
svg{display:block;width:100%;max-width:600px;height:auto}
.prompt{font-size:19px;line-height:1.5;margin:4px 0 20px}
.choice-text mjx-container,.prompt mjx-container{margin:0!important}
.choices{display:grid;gap:12px}
.choice{border:1.25px solid #222;border-radius:9px;min-height:62px;padding:12px 15px 12px 11px;display:grid;grid-template-columns:42px 1fr;align-items:center;background:#fff;cursor:pointer}
.choice:hover{background:#f7f7f7}
.choice input{position:absolute;opacity:0;pointer-events:none}
.badge{width:24px;height:24px;border:1.2px solid #444;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.choice.selected{box-shadow:inset 0 0 0 1.4px #111}
.choice.selected .badge{background:#111;color:#fff}
.choice-text{font-size:19px}
.controls{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:18px}
button{font-size:16px;padding:10px 17px;border:1.25px solid #111;background:#fff;cursor:pointer}
button:hover{background:#f2f2f2}
#feedback{min-height:24px;font-size:18px;font-weight:700}
.correct{color:#1f7a31}.incorrect{color:#b52222}
@media(max-width:650px){.page{padding:0 12px;margin-top:14px}.card{padding:16px}h1{font-size:25px}.prompt{font-size:17px}.choice-text{font-size:18px}}
</style>
<script>
window.MathJax={tex:{inlineMath:[['\\(','\\)']]},chtml:{scale:1}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
<div class="page">
  <div class="header">
    <div>
      <h1>Concavity and Rate of Change Intervals</h1>
      <div class="subtitle">Identify concavity and constant-rate intervals from a piecewise graph.</div>
    </div>
    <div class="right-status">
      <div class="clock"><span id="dateDisplay"></span> <span id="timeDisplay"></span></div>
      <div class="score">Score: <span id="correctCount">0</span> / 5</div>
    </div>
  </div>

  <div class="card">
    <div class="graph-title">Graph of \(f\)</div>
    <div id="graph" class="graph-wrap"></div>
    <div id="promptText" class="prompt"></div>
    <form id="choices" class="choices"></form>
    <div class="controls">
      <button id="actionButton" type="button">Check Answer</button>
      <div id="feedback"></div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

var correctCount=0, answered=false, current=null;
var lastConcept=null;

function updateClock(){
  var now=new Date();
  document.getElementById("dateDisplay").textContent=(now.getMonth()+1)+"/"+now.getDate();
  document.getElementById("timeDisplay").textContent=now.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit",second:"2-digit"});
}
updateClock(); setInterval(updateClock,1000);

function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function typeset(target){
  function run(){if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise(target?[target]:undefined)}
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(run);else setTimeout(run,100);
}
function interval(a,b){return "\\(("+a+", "+b+")\\)"}

function nextConcept(){
  var all=["concaveUp","concaveDown","rocIncreasing","rocDecreasing","positiveConstant","negativeConstant"];
  var options=all.filter(function(x){return x!==lastConcept});
  var c=pick(options); lastConcept=c; return c;
}

function makeProblem(){
  // Fixed overall window, but varied semicircle placement/diameter.
  // Each side has one semicircle whose inner endpoint connects to the origin.
  // The two semicircle baselines always have opposite nonzero signs, which
  // forces one connecting line to have positive slope and the other negative.
  var leftOptions=[
    {a:-10,b:-6},{a:-9,b:-5},{a:-8,b:-4},{a:-7,b:-3},
    {a:-10,b:-4},{a:-9,b:-3}
  ];
  var rightOptions=[
    {a:3,b:7},{a:4,b:8},{a:5,b:9},{a:6,b:10},
    {a:3,b:9},{a:4,b:10}
  ];

  var L=pick(leftOptions);
  var R=pick(rightOptions);

  var levelMag=pick([2,3]);
  var baseSign=pick([-1,1]);
  var leftBase=baseSign*levelMag;
  var rightBase=baseSign*levelMag;

  // Exactly one semicircle is concave down (upper) and the other concave up (lower).
  var leftUpper=Math.random()<0.5;
  var rightUpper=!leftUpper;

  function semi(a,b,base,upper){
    return {type:"semi",a:a,b:b,base:base,upper:upper};
  }
  function line(a,b,y1,y2){
    return {type:"line",a:a,b:b,y1:y1,y2:y2,slope:(y2-y1)/(b-a)};
  }

  // Structure is always:
  // left semicircle -> line to (0,0) -> line from (0,0) -> right semicircle.
  var pieces=[
    semi(L.a,L.b,leftBase,leftUpper),
    line(L.b,0,leftBase,0),
    line(0,R.a,0,rightBase),
    semi(R.a,R.b,rightBase,rightUpper)
  ];

  var answersByConcept={};
  pieces.forEach(function(p){
    var key=interval(p.a,p.b);
    if(p.type==="semi"){
      if(p.upper){
        answersByConcept.concaveDown=key;
        answersByConcept.rocDecreasing=key;
      }else{
        answersByConcept.concaveUp=key;
        answersByConcept.rocIncreasing=key;
      }
    }else{
      if(p.slope>0) answersByConcept.positiveConstant=key;
      if(p.slope<0) answersByConcept.negativeConstant=key;
    }
  });

  var concept=nextConcept();
  var wording={
    concaveUp:"concave up",
    concaveDown:"concave down",
    rocIncreasing:"has an increasing rate of change",
    rocDecreasing:"has a decreasing rate of change",
    positiveConstant:"has a positive constant rate of change",
    negativeConstant:"has a negative constant rate of change"
  }[concept];

  var correct=answersByConcept[concept];
  var allIntervals=pieces.map(function(p){return interval(p.a,p.b)});
  var distractors=shuffle(allIntervals.filter(function(x){return x!==correct})).slice(0,3);
  var answers=shuffle([correct].concat(distractors)).map(function(x){
    return {text:x,correct:x===correct};
  });

  return {
    pieces:pieces,
    concept:concept,
    prompt:"The graph of the function \\(f\\) is shown. Over which of the following intervals "+wording+"?",
    answers:answers
  };
}

function graphSVG(prob){
  var W=600,H=390,pL=54,pR=24,pT=20,pB=42;
  var xmin=-11,xmax=11,ymin=-7,ymax=7;
  function sx(x){return pL+(x-xmin)*(W-pL-pR)/(xmax-xmin)}
  function sy(y){return H-pB-(y-ymin)*(H-pT-pB)/(ymax-ymin)}

  var grid="",labels="";
  for(var gx=-10;gx<=10;gx++){
    var X=sx(gx);
    grid+="<line x1='"+X+"' y1='"+pT+"' x2='"+X+"' y2='"+(H-pB)+"' stroke='#d0d0d0' stroke-width='0.8'/>";
    if(gx!==0) labels+="<text x='"+X+"' y='"+(sy(0)+18)+"' text-anchor='middle' font-size='12' font-family='Times New Roman'>"+gx+"</text>";
  }
  for(var gy=-6;gy<=6;gy++){
    var Y=sy(gy);
    grid+="<line x1='"+pL+"' y1='"+Y+"' x2='"+(W-pR)+"' y2='"+Y+"' stroke='#d0d0d0' stroke-width='0.8'/>";
    if(gy!==0) labels+="<text x='"+(sx(0)-7)+"' y='"+(Y+4)+"' text-anchor='end' font-size='12' font-family='Times New Roman'>"+gy+"</text>";
  }

  var axis="<line x1='"+pL+"' y1='"+sy(0)+"' x2='"+(W-pR)+"' y2='"+sy(0)+"' stroke='#111' stroke-width='1.4'/>"+
           "<line x1='"+sx(0)+"' y1='"+pT+"' x2='"+sx(0)+"' y2='"+(H-pB)+"' stroke='#111' stroke-width='1.4'/>";

  var paths="";
  prob.pieces.forEach(function(p){
    if(p.type==="line"){
      paths+="<path d='M "+sx(p.a)+" "+sy(p.y1)+" L "+sx(p.b)+" "+sy(p.y2)+"' fill='none' stroke='#111' stroke-width='3.2' stroke-linecap='round'/>";
    }else{
      var cx=(p.a+p.b)/2, r=(p.b-p.a)/2;
      var d="";
      for(var i=0;i<=120;i++){
        var x=p.a+(p.b-p.a)*i/120;
        var inside=Math.max(0,r*r-(x-cx)*(x-cx));
        var y=p.base+(p.upper?1:-1)*Math.sqrt(inside);
        d+=(i===0?"M":"L")+sx(x).toFixed(2)+" "+sy(y).toFixed(2)+" ";
      }
      paths+="<path d='"+d+"' fill='none' stroke='#111' stroke-width='3.2' stroke-linecap='round'/>";
    }
  });

  return "<svg viewBox='0 0 "+W+" "+H+"' role='img' aria-label='Piecewise graph of f'>"+
    grid+axis+labels+paths+
    "<text x='"+(W-pR+8)+"' y='"+(sy(0)+4)+"' font-size='15' font-family='Times New Roman' font-style='italic'>x</text>"+
    "<text x='"+(sx(0)+7)+"' y='"+(pT-3)+"' font-size='15' font-family='Times New Roman' font-style='italic'>y</text>"+
    "</svg>";
}

function renderChoices(p){
  var form=document.getElementById("choices"); form.innerHTML="";
  ["A","B","C","D"].forEach(function(letter,i){
    var a=p.answers[i];
    var label=document.createElement("label");
    label.className="choice";
    label.innerHTML="<input type='radio' name='choice' value='"+i+"'><span class='badge'>"+letter+"</span><span class='choice-text'>"+a.text+"</span>";
    var input=label.querySelector("input"); input.dataset.correct=a.correct?"true":"false";
    label.addEventListener("click",function(){
      document.querySelectorAll(".choice").forEach(function(el){el.classList.remove("selected")});
      label.classList.add("selected"); input.checked=true;
    });
    form.appendChild(label);
  });
}

function newProblem(){
  answered=false; current=makeProblem();
  document.getElementById("feedback").textContent="";
  document.getElementById("feedback").className="";
  document.getElementById("actionButton").textContent="Check Answer";
  document.getElementById("graph").innerHTML=graphSVG(current);
  document.getElementById("promptText").innerHTML=current.prompt;
  renderChoices(current);
  typeset(document.querySelector(".card"));
}

function checkAnswer(){
  if(answered)return;
  var selected=document.querySelector("input[name='choice']:checked");
  var fb=document.getElementById("feedback");
  if(!selected){fb.textContent="Select an answer choice first.";fb.className="incorrect";return}
  answered=true;
  if(selected.dataset.correct==="true"){correctCount=Math.min(5,correctCount+1);fb.textContent="Correct!";fb.className="correct"}
  else{correctCount=0;fb.textContent="Not quite. Score reset to 0.";fb.className="incorrect"}
  document.getElementById("correctCount").textContent=correctCount;
  document.getElementById("actionButton").textContent="New Question";
}
document.getElementById("actionButton").addEventListener("click",function(){answered?newProblem():checkAnswer()});
newProblem();
})();
</script>
</body>
</html>
