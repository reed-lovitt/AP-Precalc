<style>

body{margin:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}

<script>
window.MathJax = {
  tex: { inlineMath: [['\\(','\\)']] },
  svg: { fontCache: 'global' }

<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

<body>
<div class="page">
  <h1>Even and Odd Function Practice</h1>
  <div class="subtitle">Use the graph and symmetry to find the requested function value.</div>

  <div class="topbar">
    <div class="right-status">
      <div class="clock"><span id="dateDisplay"></span> <span id="timeDisplay"></span></div>
      <div class="score">Score: <span id="correctCount">0</span> / 5</div>
    </div>
  </div>

  <div class="problem-box">
    <div class="function-type" id="functionType"></div>
    <div class="question" id="promptText"></div>

    <svg id="graph" viewBox="0 0 800 420" aria-label="coordinate graph"></svg>

    <form class="choices">
      <label class="choice"><input type="radio" name="choice" value="0"><span class="choice-letter">A.</span><span class="choice-value" id="choice0"></span></label>
      <label class="choice"><input type="radio" name="choice" value="1"><span class="choice-letter">B.</span><span class="choice-value" id="choice1"></span></label>
      <label class="choice"><input type="radio" name="choice" value="2"><span class="choice-letter">C.</span><span class="choice-value" id="choice2"></span></label>
      <label class="choice"><input type="radio" name="choice" value="3"><span class="choice-letter">D.</span><span class="choice-value" id="choice3"></span></label>
    </form>

    <div class="button-row"><button id="actionButton" type="button">Check Answer</button></div>
    <div id="feedback"></div>
  </div>
</div>

<script>
(function(){
function typesetMath(target){
  function run(){
    if(window.MathJax && MathJax.typesetPromise){
      MathJax.typesetPromise(target ? [target] : undefined);
    }
  }
  if(window.MathJax && MathJax.startup && MathJax.startup.promise){
    MathJax.startup.promise.then(run);
  }else{
    setTimeout(run,100);
  }
}
"use strict";

var svg=document.getElementById("graph");
var functionType=document.getElementById("functionType");
var promptText=document.getElementById("promptText");
var actionButton=document.getElementById("actionButton");
var feedback=document.getElementById("feedback");

var answered=false;
var correctCount=0;
var attemptCount=0;
function updateClock(){
  var now=new Date();
  document.getElementById("dateDisplay").textContent=(now.getMonth()+1)+"/"+now.getDate();
  document.getElementById("timeDisplay").textContent=now.toLocaleTimeString(undefined,{
    hour:"numeric",minute:"2-digit",second:"2-digit"
  });
}
updateClock();
setInterval(updateClock,1000);

var currentProblem=null;

// Exactly 20% hole questions: one per shuffled block of five.
var holeQuestionCycle=[];

function nextHoleQuestion(){
  if(holeQuestionCycle.length===0){
    holeQuestionCycle=shuffle([true,false,false,false,false]);
  }
  return holeQuestionCycle.pop();
}

var GL=85, GR=745, GT=25, GB=365;
var XMIN=-6, XMAX=6, YMIN=-6, YMAX=6;

function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[randInt(0,arr.length-1)]; }

function shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

function svgEl(type,attrs){
  var e=document.createElementNS("http://www.w3.org/2000/svg",type);
  Object.keys(attrs||{}).forEach(function(k){ e.setAttribute(k,attrs[k]); });
  return e;
}

function xp(x){ return GL+(x-XMIN)*(GR-GL)/(XMAX-XMIN); }
function yp(y){ return GB-(y-YMIN)*(GB-GT)/(YMAX-YMIN); }

function addText(x,y,text,attrs){
  var a=attrs||{};
  a.x=x; a.y=y;
  var t=svgEl("text",a);
  t.textContent=text;
  svg.appendChild(t);
}

function drawGrid(){
  var x,y;
  for(x=XMIN;x<=XMAX;x++){
    svg.appendChild(svgEl("line",{
      x1:xp(x),y1:GT,x2:xp(x),y2:GB,
      stroke:x===0?"#111":"#ddd","stroke-width":x===0?2:1
    }));
  }
  for(y=YMIN;y<=YMAX;y++){
    svg.appendChild(svgEl("line",{
      x1:GL,y1:yp(y),x2:GR,y2:yp(y),
      stroke:y===0?"#111":"#ddd","stroke-width":y===0?2:1
    }));
  }
  for(x=XMIN;x<=XMAX;x++){
    if(x!==0){
      addText(xp(x),yp(0)+22,String(x),{
        "text-anchor":"middle","font-size":14,"font-family":"Times New Roman"
      });
    }
  }
  for(y=YMIN;y<=YMAX;y++){
    if(y!==0){
      addText(xp(0)-12,yp(y)+5,String(y),{
        "text-anchor":"end","font-size":14,"font-family":"Times New Roman"
      });
    }
  }
  addText(xp(XMAX)-8,yp(0)-8,"x",{
    "text-anchor":"end","font-size":16,"font-family":"Times New Roman","font-style":"italic"
  });
  addText(xp(0)+8,yp(YMAX)+16,"y",{
    "text-anchor":"start","font-size":16,"font-family":"Times New Roman","font-style":"italic"
  });
}

function addFilledPoint(x,y){
  svg.appendChild(svgEl("circle",{cx:xp(x),cy:yp(y),r:6,fill:"#111"}));
}

function addOpenPoint(x,y){
  svg.appendChild(svgEl("circle",{
    cx:xp(x),cy:yp(y),r:8,fill:"#fff",stroke:"#111","stroke-width":3
  }));
}

function addPolyline(points){
  svg.appendChild(svgEl("polyline",{
    points:points.map(function(p){return xp(p[0])+","+yp(p[1]);}).join(" "),
    fill:"none",stroke:"#111","stroke-width":3.5,
    "stroke-linejoin":"round","stroke-linecap":"round"
  }));
}

function yForParity(type,y){
  return type==="even" ? y : -y;
}

function makeChoices(answer,givenY,dotY){
  var pool=[];
  function add(v){
    if(typeof v!=="number" || !Number.isFinite(v)) return;
    if(v===answer) return;
    if(pool.indexOf(v)===-1) pool.push(v);
  }

  add(givenY);
  add(-givenY);
  add(dotY);
  add(-dotY);
  add(0);
  add(answer+1);
  add(answer-1);
  add(1);
  add(-1);

  while(pool.length<3){
    add(randInt(-6,6));
  }

  return shuffle([
    {value:answer,correct:true},
    {value:pool[0],correct:false},
    {value:pool[1],correct:false},
    {value:pool[2],correct:false}
  ]);
}

function makeProblem(){
  var type=Math.random()<0.5 ? "even" : "odd";
  var asksAboutDisjointDot=nextHoleQuestion();

  // Exactly one visible positive-side interval:
  //   [0,3)   OR   (3,6]
  // The negative side shows the mirror of the positive interval that was skipped.
  var positiveShowsInner=Math.random()<0.5;

  var posInnerMidX=pick([1,2]);
  var posOuterMidX=pick([4,5]);

  var inner0Y=type==="odd" ? 0 : randInt(-5,5);
  var innerMidY=randInt(-5,5);
  var innerOpenY=randInt(-4,4);

  var outerOpenY=randInt(-4,4);
  var outerMidY=randInt(-5,5);
  var outerEndY=randInt(-5,5);

  var posInner=[[0,inner0Y],[posInnerMidX,innerMidY],[3,innerOpenY]];
  var posOuter=[[3,outerOpenY],[posOuterMidX,outerMidY],[6,outerEndY]];

  function mirrorPiece(piece){
    return piece.map(function(pt){
      return [-pt[0], type==="even" ? pt[1] : -pt[1]];
    }).reverse();
  }

  var posPiece,negPiece;
  if(positiveShowsInner){
    posPiece=posInner;           // [0,3)
    negPiece=mirrorPiece(posOuter); // [-6,-3)
  }else{
    posPiece=posOuter;           // (3,6]
    negPiece=mirrorPiece(posInner); // (-3,0]
  }

  // ALWAYS one separate filled dot at x=3 or x=-3.
  var dotX=Math.random()<0.5 ? 3 : -3;
  var openYAtDotX;

  function endpointYAtX(piece,x){
    for(var i=0;i<piece.length;i++){
      if(piece[i][0]===x) return piece[i][1];
    }
    return null;
  }

  openYAtDotX=endpointYAtX(posPiece,dotX);
  if(openYAtDotX===null) openYAtDotX=endpointYAtX(negPiece,dotX);

  var dotY;
  do{
    dotY=randInt(-5,5);
  }while(dotY===openYAtDotX);

  var givenX,givenY,askX,answer;

  if(asksAboutDisjointDot){
    givenX=dotX;
    givenY=dotY;
    askX=-dotX;
    answer=type==="even" ? dotY : -dotY;
  }else{
    var displayedPoints=posPiece.concat(negPiece);
    var candidates=displayedPoints.filter(function(pt){
      return pt[0]!==3 && pt[0]!==-3 && pt[0]!==0;
    });
    var displayed=pick(candidates);

    givenX=displayed[0];
    givenY=displayed[1];
    askX=-givenX;
    answer=type==="even" ? givenY : -givenY;
  }

  return {
    type:type,
    posPiece:posPiece,
    negPiece:negPiece,
    dotX:dotX,
    dotY:dotY,
    givenX:givenX,
    givenY:givenY,
    askX:askX,
    answer:answer,
    choices:makeChoices(answer,givenY,dotY)
  };
}

function drawProblem(p){
  svg.innerHTML="";
  drawGrid();

  addPolyline(p.negPiece);
  addPolyline(p.posPiece);

  function drawPiece(piece){
    for(var i=0;i<piece.length;i++){
      var x=piece[i][0], y=piece[i][1];
      if(x===3 || x===-3) addOpenPoint(x,y);
      else addFilledPoint(x,y);
    }
  }

  drawPiece(p.negPiece);
  drawPiece(p.posPiece);

  // Separate function value at one of the holes.
  addFilledPoint(p.dotX,p.dotY);
}

function renderChoices(p){
  var radios=document.querySelectorAll('input[name="choice"]');
  p.choices.forEach(function(c,i){
    document.getElementById("choice"+i).textContent=c.value;
    radios[i].checked=false;
    radios[i].dataset.correct=c.correct?"true":"false";
  });
}

function newProblem(){
  currentProblem=makeProblem();
  answered=false;
  feedback.textContent="";
  feedback.className="";
  actionButton.textContent="Check Answer";

  functionType.innerHTML='The function \\(f\\) is an <b>'+currentProblem.type+'</b> function.';
  typesetMath(functionType);
  promptText.innerHTML='Find \\(f('+currentProblem.askX+')\\).';

  drawProblem(currentProblem);
  renderChoices(currentProblem);
  typesetMath(document.querySelector(".problem-box"));
}

function checkAnswer(){
  if(answered) return;
  var selected=document.querySelector('input[name="choice"]:checked');

  if(!selected){
    feedback.textContent="Select an answer choice first.";
    feedback.className="incorrect";
    return;
  }

  answered=true;
  if(selected.dataset.correct==="true"){
    correctCount=Math.min(5,correctCount+1);
    feedback.textContent="Correct!";
    feedback.className="correct";
  }else{
    correctCount=0;
    feedback.textContent="Not quite. Score reset to 0.";
    feedback.className="incorrect";
  }

  document.getElementById("correctCount").textContent=correctCount;
  actionButton.textContent="New Question";
}

actionButton.addEventListener("click",function(){
  if(answered) newProblem();
  else checkAnswer();
});

newProblem();
})();
</script>
