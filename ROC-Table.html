<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate of Change from a Table</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #fff;
    color: #111;
    font-family: Arial, Helvetica, sans-serif;
  }
  .page {
    max-width: 900px;
    margin: 28px auto;
    padding: 0 18px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 30px;
  }
  .subtitle {
    font-size: 17px;
    color: #444;
    margin-bottom: 18px;
  }
  .topbar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    margin-bottom: 18px;
  }
  .score {
    font-size: 17px;
  }
  .problem-box {
    border: 1.5px solid #111;
    padding: 22px;
  }
  .question {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .formula-line {
    font-family: "Times New Roman", Times, serif;
    font-size: 27px;
    margin: 8px 0 18px;
  }
  .prompt {
    font-size: 18px;
    margin: 12px 0 18px;
  }

  .table-wrap {
    display: flex;
    justify-content: center;
    margin: 16px 0 22px;
    overflow-x: auto;
  }

  table.data-table {
    border-collapse: collapse;
    font-size: 21px;
    min-width: 330px;
    text-align: center;
  }
  .data-table th,
  .data-table td {
    border: 1.5px solid #111;
    padding: 11px 18px;
    min-width: 74px;
  }
  .data-table th {
    font-weight: 700;
    background: #fafafa;
  }

  .choices {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }
  .choice {
    border: 1.5px solid #111;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    background: #fff;
  }
  .choice:hover {
    background: #f2f2f2;
  }
  .choice input {
    transform: scale(1.15);
    margin: 0;
  }
  .choice-letter {
    font-weight: 700;
    min-width: 24px;
  }
  .choice-math {
    font-family: "Times New Roman", Times, serif;
    font-size: 24px;
    display: inline-flex;
    align-items: center;
  }

  .frac {
    display: inline-flex;
    flex-direction: column;
    align-items: stretch;
    vertical-align: middle;
    text-align: center;
    line-height: 1.05;
    min-width: 120px;
  }
  .frac .num {
    border-bottom: 1.7px solid #111;
    padding: 0 7px 4px;
  }
  .frac .den {
    padding: 4px 7px 0;
  }

  .button-row {
    display: flex;
    margin-top: 18px;
  }
  button {
    font-size: 17px;
    padding: 11px 18px;
    border: 1.5px solid #111;
    background: #fff;
    cursor: pointer;
  }
  button:hover {
    background: #ededed;
  }

  #feedback {
    min-height: 30px;
    margin-top: 16px;
    font-size: 19px;
    font-weight: 700;
  }
  .correct { color: #16752b; }
  .incorrect { color: #b52222; }

  @media (max-width: 650px) {
    .page {
      padding: 0 12px;
      margin-top: 18px;
    }
    .problem-box {
      padding: 16px;
    }
    h1 {
      font-size: 27px;
    }
    .choice-math {
      font-size: 21px;
    }
    .data-table th,
    .data-table td {
      padding: 9px 12px;
      min-width: 62px;
    }
  }
</style>
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(','\\)']] },
  svg: { fontCache: 'global' }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
<div class="page">
  <h1>Rate of Change from a Table</h1>
  <div class="subtitle">Choose the correct setup from the table. Do not simplify.</div>

  <div class="topbar">
    <div class="score">Score: <span id="correctCount">0</span> / <span id="attemptCount">0</span></div>
  </div>

  <div class="problem-box">
    <div class="question" id="promptText"></div>

    <div class="table-wrap" id="tableWrap"></div>

    <form id="choicesForm" class="choices">
      <label class="choice">
        <input type="radio" name="choice" value="0">
        <span class="choice-letter">A.</span>
        <span class="choice-math" id="choice0"></span>
      </label>
      <label class="choice">
        <input type="radio" name="choice" value="1">
        <span class="choice-letter">B.</span>
        <span class="choice-math" id="choice1"></span>
      </label>
      <label class="choice">
        <input type="radio" name="choice" value="2">
        <span class="choice-letter">C.</span>
        <span class="choice-math" id="choice2"></span>
      </label>
      <label class="choice">
        <input type="radio" name="choice" value="3">
        <span class="choice-letter">D.</span>
        <span class="choice-math" id="choice3"></span>
      </label>
    </form>

    <div class="button-row">
      <button id="actionButton" type="button">Check Answer</button>
    </div>

    <div id="feedback"></div>
  </div>
</div>

<script>
function typesetMath(target){
  if(window.MathJax && MathJax.typesetPromise){
    MathJax.typesetPromise(target ? [target] : undefined);
  }
}
let currentProblem = null;
let answered = false;
let correctCount = 0;
let attemptCount = 0;

function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function shuffle(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function distinctInts(count, min, max) {
  const s = new Set();
  while (s.size < count) {
    s.add(randInt(min, max));
  }
  return [...s];
}

function subtractText(first, second) {
  return second < 0 ? first+"-("+second+")" : first+"-"+second;
}
function fractionHTML(num1, num2, den1, den2) {
  return "\\(\\frac{"+subtractText(num1,num2)+"}{"+subtractText(den1,den2)+"}\\)";
}

function makeData() {
  const xs = distinctInts(5, -12, 12).sort((a, b) => a - b);

  const ys = [];
  for (let i = 0; i < xs.length; i++) {
    let y;
    do {
      y = randInt(-12, 12);
    } while (ys.includes(y));
    ys.push(y);
  }

  let iA, iB;
  do {
    iA = randInt(0, xs.length - 1);
    iB = randInt(0, xs.length - 1);
  } while (
    iA === iB ||
    Math.abs(iA - iB) < 2 ||
    ys[iA] === xs[iA] ||
    ys[iB] === xs[iB]
  );

  const a = xs[iA];
  const b = xs[iB];
  const fA = ys[iA];
  const fB = ys[iB];

  const choices = [
    // correct: (f(a)-f(b)) / (a-b)
    { n1: fA, n2: fB, d1: a,  d2: b,  correct: true },

    // flip numerator and denominator
    { n1: a,  n2: b,  d1: fA, d2: fB, correct: false },

    // reverse only the denominator
    { n1: fA, n2: fB, d1: b,  d2: a,  correct: false },

    // subtract within each point: (a-f(a)) / (b-f(b))
    { n1: a,  n2: fA, d1: b,  d2: fB, correct: false }
  ];

  return {
    xs,
    ys,
    a,
    b,
    fA,
    fB,
    orientation: Math.random() < 0.5 ? "horizontal" : "vertical",
    choices: shuffle(choices)
  };
}

function renderTable(problem) {
  const wrap = document.getElementById("tableWrap");

  if (problem.orientation === "horizontal") {
    let html = '<table class="data-table"><tr><th>\\(x\\)</th>';
    problem.xs.forEach(x => {
      html += `<td>${x}</td>`;
    });
    html += '</tr><tr><th>\\(f(x)\\)</th>';
    problem.ys.forEach(y => {
      html += `<td>${y}</td>`;
    });
    html += '</tr></table>';
    wrap.innerHTML = html;
  } else {
    let html = '<table class="data-table"><tr><th>\\(x\\)</th><th>\\(f(x)\\)</th></tr>';
    for (let i = 0; i < problem.xs.length; i++) {
      html += `<tr><td>${problem.xs[i]}</td><td>${problem.ys[i]}</td></tr>`;
    }
    html += '</table>';
    wrap.innerHTML = html;
  }
}

function renderChoices(problem) {
  const radios = document.querySelectorAll('input[name="choice"]');

  problem.choices.forEach((choice, i) => {
    document.getElementById(`choice${i}`).innerHTML =
      fractionHTML(choice.n1, choice.n2, choice.d1, choice.d2);

    radios[i].checked = false;
    radios[i].disabled = false;
    radios[i].dataset.correct = choice.correct ? "true" : "false";
  });
  typesetMath(document.querySelector(".problem-box"));
}

function newProblem() {
  currentProblem = makeData();
  answered = false;

  document.getElementById("feedback").textContent = "";
  document.getElementById("feedback").className = "";
  document.getElementById("actionButton").textContent = "Check Answer";

  const left = Math.min(currentProblem.a, currentProblem.b);
  const right = Math.max(currentProblem.a, currentProblem.b);
  document.getElementById("promptText").innerHTML =
    "Find the average rate of change on \\(["+left+", "+right+"]\\).";

  renderTable(currentProblem);
  renderChoices(currentProblem);
}

function checkAnswer() {
  if (answered) return;

  const selected = document.querySelector('input[name="choice"]:checked');
  const feedback = document.getElementById("feedback");

  if (!selected) {
    feedback.textContent = "Select an answer choice first.";
    feedback.className = "incorrect";
    return;
  }

  answered = true;
  attemptCount++;

  if (selected.dataset.correct === "true") {
    correctCount++;
    feedback.textContent = "Correct!";
    feedback.className = "correct";
  } else {
    feedback.textContent = "Not quite.";
    feedback.className = "incorrect";
  }

  document.getElementById("correctCount").textContent = correctCount;
  document.getElementById("attemptCount").textContent = attemptCount;
  document.getElementById("actionButton").textContent = "New Question";
}

document.getElementById("actionButton").addEventListener("click", () => {
  answered ? newProblem() : checkAnswer();
});

document.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    event.preventDefault();
    answered ? newProblem() : checkAnswer();
  }
});

newProblem();
</script>
</body>
</html>
