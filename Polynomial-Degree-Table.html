<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Polynomial Type from a Table</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}.page{max-width:900px;margin:28px auto;padding:0 18px}h1{margin:0 0 8px;font-size:30px}.subtitle{font-size:17px;color:#444;margin-bottom:18px}.topbar{display:flex;justify-content:flex-end;margin-bottom:18px}.problem-box{border:1.5px solid #111;padding:22px}.question{font-size:20px;font-weight:700;margin-bottom:12px}.table-wrap{display:flex;justify-content:center;margin:16px 0 22px;overflow-x:auto}table{border-collapse:collapse;font-size:21px;min-width:420px;text-align:center}th,td{border:1.5px solid #111;padding:11px 18px;min-width:76px}th{font-weight:700;background:#fafafa}.choices{display:grid;grid-template-columns:1fr;gap:10px}.choice{border:1.5px solid #111;padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;background:#fff}.choice:hover{background:#f2f2f2}.choice input{transform:scale(1.15);margin:0}.choice-letter{font-weight:700;min-width:24px}.choice-text{font-size:20px}.button-row{margin-top:18px}button{font-size:17px;padding:11px 18px;border:1.5px solid #111;background:#fff;cursor:pointer}button:hover{background:#ededed}#feedback{min-height:30px;margin-top:16px;font-size:19px;font-weight:700}.correct{color:#16752b}.incorrect{color:#b52222}@media(max-width:650px){.page{padding:0 12px;margin-top:18px}.problem-box{padding:16px}h1{font-size:27px}th,td{padding:9px 12px;min-width:62px}}
</style>
</head>
<body>
<div class="page">
<h1>Polynomial Type from a Table</h1>
<div class="subtitle">Use equal x-intervals and successive differences to identify the polynomial type.</div>
<div class="topbar">Score: <span id="correctCount">0</span>&nbsp;/&nbsp;<span id="attemptCount">0</span></div>
<div class="problem-box">
<div class="question">Which type of polynomial is represented by the table?</div>
<div class="table-wrap" id="tableWrap"></div>
<form class="choices">
<label class="choice"><input type="radio" name="choice"><span class="choice-letter">A.</span><span id="choice0" class="choice-text"></span></label>
<label class="choice"><input type="radio" name="choice"><span class="choice-letter">B.</span><span id="choice1" class="choice-text"></span></label>
<label class="choice"><input type="radio" name="choice"><span class="choice-letter">C.</span><span id="choice2" class="choice-text"></span></label>
<label class="choice"><input type="radio" name="choice"><span class="choice-letter">D.</span><span id="choice3" class="choice-text"></span></label>
</form>
<div class="button-row"><button id="actionButton" type="button">Check Answer</button></div>
<div id="feedback"></div>
</div>
</div>
<script>
(function(){
"use strict";
var currentProblem=null,answered=false,correctCount=0,attemptCount=0;
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function pick(a){return a[randInt(0,a.length-1)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function polyValue(c,x){var s=0;for(var i=0;i<c.length;i++)s+=c[i]*Math.pow(x,i);return s}
function makeXs(){var step=pick([1,2]),start=randInt(-4,2);return[0,1,2,3,4].map(function(i){return start+i*step})}
function buildPolynomial(degree){
  while(true){
    var c=[];for(var i=0;i<=degree;i++)c.push(0);
    for(i=0;i<degree;i++)c[i]=randInt(-3,3);
    c[degree]=pick([-2,-1,1,2]);
    var xs=makeXs(),ys=xs.map(function(x){return polyValue(c,x)});
    if(ys.every(function(y){return Number.isInteger(y)&&Math.abs(y)<=150}))return{xs:xs,ys:ys,degree:degree};
  }
}
function makeProblem(){
  var degree=pick([1,2,3,4]),p=buildPolynomial(degree);
  p.choices=shuffle([
    {text:"Linear",correct:degree===1},
    {text:"Quadratic",correct:degree===2},
    {text:"Cubic",correct:degree===3},
    {text:"Quartic",correct:degree===4}
  ]);
  p.orientation=Math.random()<.5?"horizontal":"vertical";
  return p;
}
function renderTable(p){
  var h="";
  if(p.orientation==="horizontal"){
    h="<table><tr><th>x</th>";p.xs.forEach(function(x){h+="<td>"+x+"</td>"});h+="</tr><tr><th>f(x)</th>";p.ys.forEach(function(y){h+="<td>"+y+"</td>"});h+="</tr></table>";
  }else{
    h="<table><tr><th>x</th><th>f(x)</th></tr>";for(var i=0;i<p.xs.length;i++)h+="<tr><td>"+p.xs[i]+"</td><td>"+p.ys[i]+"</td></tr>";h+="</table>";
  }
  document.getElementById("tableWrap").innerHTML=h;
}
function renderChoices(p){
  var r=document.querySelectorAll('input[name="choice"]');
  p.choices.forEach(function(c,i){document.getElementById("choice"+i).textContent=c.text;r[i].checked=false;r[i].dataset.correct=c.correct?"true":"false"});
}
function newProblem(){
  currentProblem=makeProblem();answered=false;var f=document.getElementById("feedback");f.textContent="";f.className="";document.getElementById("actionButton").textContent="Check Answer";renderTable(currentProblem);renderChoices(currentProblem);
}
function checkAnswer(){
  if(answered)return;var s=document.querySelector('input[name="choice"]:checked'),f=document.getElementById("feedback");
  if(!s){f.textContent="Select an answer choice first.";f.className="incorrect";return}
  answered=true;attemptCount++;
  if(s.dataset.correct==="true"){correctCount++;f.textContent="Correct!";f.className="correct"}else{f.textContent="Not quite.";f.className="incorrect"}
  document.getElementById("correctCount").textContent=correctCount;document.getElementById("attemptCount").textContent=attemptCount;document.getElementById("actionButton").textContent="New Question";
}
document.getElementById("actionButton").addEventListener("click",function(){answered?newProblem():checkAnswer()});
newProblem();
})();
</script>
</body>
</html>
