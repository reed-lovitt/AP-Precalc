<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compare Rate of Change from a Graph</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}
.page{max-width:900px;margin:28px auto;padding:0 18px}
h1{margin:0 0 8px;font-size:30px}
.subtitle{font-size:17px;color:#444;margin-bottom:18px}
.topbar{display:flex;justify-content:flex-end;margin-bottom:18px}
.score{font-size:17px}
.problem-box{border:1.5px solid #111;padding:22px}
.question{font-size:20px;font-weight:700;margin-bottom:10px}
#graph{width:100%;height:410px;display:block;margin:8px 0 18px}
.choices{display:grid;grid-template-columns:1fr;gap:10px}
.choice{border:1.5px solid #111;padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;background:#fff}
.choice:hover{background:#f2f2f2}
.choice input{transform:scale(1.15);margin:0}
.choice-letter{font-weight:700;min-width:24px}
.choice-text{font-size:20px}
.button-row{margin-top:18px}
button{font-size:17px;padding:11px 18px;border:1.5px solid #111;background:#fff;cursor:pointer}
button:hover{background:#ededed}
#feedback{min-height:30px;margin-top:16px;font-size:19px;font-weight:700}
.correct{color:#16752b}
.incorrect{color:#b52222}
@media(max-width:650px){
  .page{padding:0 12px;margin-top:18px}
  .problem-box{padding:16px}
  h1{font-size:27px}
  #graph{height:330px}
}
</style>
</head>
<body>
<div class="page">
  <h1>Compare Rate of Change from a Graph</h1>
  <div class="subtitle">Compare the steepness and direction of the graph at two x-values.</div>

  <div class="topbar">
    <div class="score">Score: <span id="correctCount">0</span> / <span id="attemptCount">0</span></div>
  </div>

  <div class="problem-box">
    <div class="question" id="promptText"></div>
    <svg id="graph" viewBox="0 0 800 410" aria-label="coordinate graph"></svg>

    <form class="choices">
      <label class="choice"><input type="radio" name="choice" value="0"><span class="choice-letter">A.</span><span class="choice-text" id="choice0"></span></label>
      <label class="choice"><input type="radio" name="choice" value="1"><span class="choice-letter">B.</span><span class="choice-text" id="choice1"></span></label>
      <label class="choice"><input type="radio" name="choice" value="2"><span class="choice-letter">C.</span><span class="choice-text" id="choice2"></span></label>
    </form>

    <div class="button-row"><button id="actionButton" type="button">Check Answer</button></div>
    <div id="feedback"></div>
  </div>
</div>

<script>
(function(){
"use strict";

var svg=document.getElementById("graph");
var promptText=document.getElementById("promptText");
var actionButton=document.getElementById("actionButton");
var feedback=document.getElementById("feedback");

var answered=false;
var correctCount=0;
var attemptCount=0;
var currentProblem=null;

var GL=72, GR=760, GT=24, GB=355;
var XMIN=-8, XMAX=8, YMIN=-8, YMAX=8;

function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function pick(arr){return arr[randInt(0,arr.length-1)];}

function shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}

function svgEl(type,attrs){
  var e=document.createElementNS("http://www.w3.org/2000/svg",type);
  Object.keys(attrs||{}).forEach(function(k){e.setAttribute(k,attrs[k]);});
  return e;
}

function xp(x){return GL+(x-XMIN)*(GR-GL)/(XMAX-XMIN);}
function yp(y){return GB-(y-YMIN)*(GB-GT)/(YMAX-YMIN);}

function addText(x,y,text,attrs){
  var a=attrs||{};a.x=x;a.y=y;
  var t=svgEl("text",a);t.textContent=text;svg.appendChild(t);
}

function drawGrid(){
  var x,y;
  for(x=XMIN;x<=XMAX;x++){
    svg.appendChild(svgEl("line",{
      x1:xp(x),y1:GT,x2:xp(x),y2:GB,
      stroke:x===0?"#111":"#ddd","stroke-width":x===0?2:1
    }));
  }
  for(y=YMIN;y<=YMAX;y++){
    svg.appendChild(svgEl("line",{
      x1:GL,y1:yp(y),x2:GR,y2:yp(y),
      stroke:y===0?"#111":"#ddd","stroke-width":y===0?2:1
    }));
  }
  for(x=XMIN;x<=XMAX;x++){
    if(x!==0 && x%2===0) addText(xp(x),yp(0)+22,String(x),{
      "text-anchor":"middle","font-size":14,"font-family":"Arial"
    });
  }
  for(y=YMIN;y<=YMAX;y++){
    if(y!==0 && y%2===0) addText(xp(0)-12,yp(y)+5,String(y),{
      "text-anchor":"end","font-size":14,"font-family":"Arial"
    });
  }
}

function makeProblem(){
  while(true){
    // 2/3 nonlinear quadratic, 1/3 linear so "same" is sometimes correct.
    var linear=Math.random()<1/3;
    var x1,x2;
    do{
      x1=randInt(-5,5);
      x2=randInt(-5,5);
    }while(x1===x2 || Math.abs(x1-x2)<2);

    if(x1>x2){var temp=x1;x1=x2;x2=temp;}

    var fn,slope1,slope2;

    if(linear){
      var m;
      do{m=pick([-1.5,-1,-0.5,0.5,1,1.5]);}while(m===0);
      var b=randInt(-2,2);
      fn=function(x){return m*x+b;};
      slope1=m;
      slope2=m;
    }else{
      var h=randInt(-2,2);
      var a=pick([-0.3,-0.25,-0.2,0.2,0.25,0.3]);
      var k=randInt(-2,2);
      fn=function(x){return a*(x-h)*(x-h)+k;};
      slope1=2*a*(x1-h);
      slope2=2*a*(x2-h);
    }

    var y1=fn(x1);
    var y2=fn(x2);

    // Keep both labeled comparison points comfortably inside the visible window.
    if(y1<-6.5 || y1>6.5 || y2<-6.5 || y2>6.5) continue;

    var answer;
    if(Math.abs(slope1-slope2)<0.0001) answer="same";
    else answer=slope1>slope2 ? "x1" : "x2";

    var choices=shuffle([
      {text:"At a",correct:answer==="x1"},
      {text:"At b",correct:answer==="x2"},
      {text:"The rates of change are the same.",correct:answer==="same"}
    ]);

    return {fn:fn,x1:x1,x2:x2,choices:choices};
  }
}
function drawCurve(p){
  svg.innerHTML="";
  drawGrid();

  var path="";
  var started=false;
  for(var i=0;i<=240;i++){
    var x=XMIN+(XMAX-XMIN)*i/240;
    var y=p.fn(x);
    if(y<YMIN-0.2 || y>YMAX+0.2){
      started=false;
      continue;
    }
    path+=(started?" L ":" M ")+xp(x)+" "+yp(y);
    started=true;
  }

  svg.appendChild(svgEl("path",{
    d:path,fill:"none",stroke:"#111","stroke-width":4,
    "stroke-linecap":"round","stroke-linejoin":"round"
  }));

  [
    {x:p.x1,label:"a"},
    {x:p.x2,label:"b"}
  ].forEach(function(item){
    var y=p.fn(item.x);
    svg.appendChild(svgEl("circle",{cx:xp(item.x),cy:yp(y),r:6,fill:"#111"}));
    addText(xp(item.x),yp(y)-14,item.label,{
      "text-anchor":"middle","font-size":18,"font-family":"Arial","font-weight":"700"
    });
  });
}

function renderChoices(p){
  var radios=document.querySelectorAll('input[name="choice"]');
  p.choices.forEach(function(c,i){
    document.getElementById("choice"+i).textContent=c.text;
    radios[i].checked=false;
    radios[i].dataset.correct=c.correct?"true":"false";
  });
}

function newProblem(){
  currentProblem=makeProblem();
  answered=false;
  feedback.textContent="";
  feedback.className="";
  actionButton.textContent="Check Answer";
  promptText.textContent="At which point is the rate of change greater?";
  drawCurve(currentProblem);
  renderChoices(currentProblem);
}

function checkAnswer(){
  if(answered)return;
  var selected=document.querySelector('input[name="choice"]:checked');
  if(!selected){
    feedback.textContent="Select an answer choice first.";
    feedback.className="incorrect";
    return;
  }
  answered=true;
  attemptCount++;

  if(selected.dataset.correct==="true"){
    correctCount++;
    feedback.textContent="Correct!";
    feedback.className="correct";
  }else{
    feedback.textContent="Not quite.";
    feedback.className="incorrect";
  }

  document.getElementById("correctCount").textContent=correctCount;
  document.getElementById("attemptCount").textContent=attemptCount;
  actionButton.textContent="New Question";
}

actionButton.addEventListener("click",function(){
  if(answered)newProblem();
  else checkAnswer();
});

newProblem();
})();
</script>
</body>
</html>
