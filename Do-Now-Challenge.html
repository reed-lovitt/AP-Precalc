<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do Now Challenge</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}
.page{max-width:1200px;margin:26px auto 40px;padding:0 24px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:18px}
h1{margin:0 0 5px;font-size:32px}
.subtitle{font-size:17px;color:#555}
.controls{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:20px 0 24px}
.control{display:flex;flex-direction:column;gap:6px}
.control-label{font-size:14px;font-weight:700}
.pool-row{display:flex;align-items:center;gap:7px;margin-bottom:7px}
select,input,button{
  font:inherit;
  border:1.25px solid #111;
  background:#fff;
  min-height:44px
}
select{min-width:180px;padding:10px 12px}
input[type="number"]{width:88px;padding:10px 12px}
button{cursor:pointer;padding:10px 16px}
button:hover{background:#f2f2f2}
button:disabled{opacity:.45;cursor:not-allowed}
.icon-button{width:44px;padding:0;font-size:23px;line-height:1}
.remove-button{width:38px;min-height:38px;padding:0;font-size:20px}
.actions{display:flex;gap:9px;align-items:center}
.rule{
  border:1.4px solid #111;
  padding:13px 16px;
  margin-bottom:22px;
  font-size:18px;
  font-weight:700;
  text-align:center
}
.status{min-height:24px;color:#555;margin:-8px 0 15px;font-size:15px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:18px
}
.card{
  border:1.4px solid #111;
  border-radius:9px;
  min-height:410px;
  padding:20px 18px 18px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  text-align:center
}
.number{
  width:30px;height:30px;border:1.2px solid #111;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;margin-bottom:12px
}
.qr{
  width:250px;height:250px;
  display:flex;align-items:center;justify-content:center;
  margin:2px auto 14px
}
.qr img,.qr canvas{max-width:100%;height:auto}
.name{
  font-size:19px;
  font-weight:700;
  line-height:1.25;
  overflow-wrap:anywhere
}
.ced{
  margin-top:8px;
  font-size:14px;
  line-height:1.3;
  color:#333
}
.small{font-size:13px;color:#777;margin-top:5px}
.empty{
  grid-column:1/-1;
  border:1.4px solid #111;
  padding:36px;
  text-align:center;
  font-size:18px
}
@media(max-width:700px){
  .page{padding:0 12px;margin-top:16px}
  .controls{align-items:stretch}
  .control{width:100%}
  .pool-row select{flex:1;min-width:0}
  .actions{width:100%}
  .actions button{flex:1}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="page">
  <div class="top">
    <div>
      <h1>Do Now Challenge</h1>
      <div class="subtitle">Randomly select practice activities from one or more unit folders.</div>
    </div>
  </div>

  <div class="controls">
    <div class="control">
      <div class="control-label">Activity pool</div>
      <div id="unitRows"></div>
      <button id="addUnitButton" class="icon-button" type="button" title="Add another unit">+</button>
    </div>

    <div class="control">
      <label class="control-label" for="activityCount">Activities</label>
      <input id="activityCount" type="number" min="1" max="12" step="1" value="3">
    </div>

    <div class="actions">
      <button id="generateButton" type="button">Generate Round</button>
    </div>
  </div>

  <div class="rule" id="ruleText">First person to show 5/5 on all 3 activities wins.</div>
  <div class="status" id="status"></div>
  <div class="grid" id="grid"></div>
</div>

<script>
(function(){
"use strict";

var owner="reed-lovitt";
var repo="AP-Precalc";
var pagesBase="https://reed-lovitt.github.io/AP-Precalc/";
var unitRows=document.getElementById("unitRows");
var addUnitButton=document.getElementById("addUnitButton");
var activityCount=document.getElementById("activityCount");
var generateButton=document.getElementById("generateButton");
var ruleText=document.getElementById("ruleText");
var grid=document.getElementById("grid");
var status=document.getElementById("status");

var availableUnits=["Unit 1A","Unit 1B"];

var fallback={
  "Unit 1A":[
    "Compare-ROC-Graph.html",
    "Complex-Conjugate-Zeros.html",
    "Even-Odd-Graph.html",
    "Interval-Practice.html",
    "Minimum-Polynomial-Degree.html",
    "Polynomial-Degree-Leading-Coefficient.html",
    "Polynomial-Degree-Table.html",
    "Polynomial-Degree-from-Factors.html",
    "Polynomial-End-Behavior-Expression.html",
    "Polynomial-End-Behavior.html",
    "Polynomial-Global-Extrema.html",
    "Polynomial-Graph-to-Equation.html",
    "ROC-Graph.html",
    "ROC-Patterns-Table.html",
    "ROC-Table.html",
    "Rate-of-change-and-concavity.html"
  ],
  "Unit 1B":[]
};

var titles={
  "Compare-ROC-Graph.html":"Compare Rates of Change",
  "Complex-Conjugate-Zeros.html":"Complex Conjugate Zeros",
  "Even-Odd-Graph.html":"Even and Odd Functions",
  "Interval-Practice.html":"Interval Notation",
  "Minimum-Polynomial-Degree.html":"Minimum Polynomial Degree",
  "Polynomial-Degree-Leading-Coefficient.html":"Degree and Leading Coefficient",
  "Polynomial-Degree-Table.html":"Polynomial Degree from a Table",
  "Polynomial-Degree-from-Factors.html":"Polynomial Degree from Factors",
  "Polynomial-End-Behavior-Expression.html":"End Behavior from an Expression",
  "Polynomial-End-Behavior.html":"Polynomial End Behavior",
  "Polynomial-Global-Extrema.html":"Global Extrema of Polynomials",
  "Polynomial-Graph-to-Equation.html":"Polynomial Graph to Equation",
  "ROC-Graph.html":"Average Rate of Change from a Graph",
  "ROC-Patterns-Table.html":"Rate-of-Change Patterns from a Table",
  "ROC-Table.html":"Average Rate of Change from a Table",
  "Rate-of-change-and-concavity.html":"Rate of Change and Concavity"
};

var ced={
  "Interval-Practice.html":"Foundational notation — used throughout Unit 1",
  "ROC-Table.html":"CED 1.2 — Rates of Change",
  "ROC-Graph.html":"CED 1.2 — Rates of Change",
  "Compare-ROC-Graph.html":"CED 1.2 — Rates of Change",
  "ROC-Patterns-Table.html":"CED 1.3 — Rates of Change in Linear and Quadratic Functions",
  "Rate-of-change-and-concavity.html":"CED 1.4 — Polynomial Functions and Rates of Change",
  "Even-Odd-Graph.html":"CED 1.5 — Polynomial Functions and Complex Zeros",
  "Complex-Conjugate-Zeros.html":"CED 1.5 — Polynomial Functions and Complex Zeros",
  "Minimum-Polynomial-Degree.html":"CED 1.5 — Polynomial Functions and Complex Zeros",
  "Polynomial-Degree-Table.html":"CED 1.5 — Polynomial Functions and Complex Zeros",
  "Polynomial-Degree-from-Factors.html":"CED 1.5 — Polynomial Functions and Complex Zeros",
  "Polynomial-Graph-to-Equation.html":"CED 1.5 — Polynomial Functions and Complex Zeros",
  "Polynomial-Degree-Leading-Coefficient.html":"CED 1.6 — Polynomial Functions and End Behavior",
  "Polynomial-Global-Extrema.html":"CED 1.6 — Polynomial Functions and End Behavior",
  "Polynomial-End-Behavior.html":"CED 1.6 — Polynomial Functions and End Behavior",
  "Polynomial-End-Behavior-Expression.html":"CED 1.6 — Polynomial Functions and End Behavior"
};

function shuffle(a){
  a=a.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}

var HISTORY_KEY="doNowRecentActivitiesV1";

function loadHistory(){
  try{
    var raw=localStorage.getItem(HISTORY_KEY);
    var parsed=raw?JSON.parse(raw):[];
    return Array.isArray(parsed)?parsed:[];
  }catch(err){
    return [];
  }
}

function saveHistory(history){
  try{
    localStorage.setItem(HISTORY_KEY,JSON.stringify(history.slice(-24)));
  }catch(err){}
}

function activityKey(item){
  return item.unit+"::"+item.file;
}

// Strongly prefer activities not seen in the most recent rounds.
// Recent activities can still appear, but get a much lower selection weight.
function weightedPickWithoutReplacement(pool,count){
  var recent=loadHistory();
  var working=pool.slice();
  var picked=[];

  while(picked.length<count && working.length){
    var weights=working.map(function(item){
      var key=activityKey(item);
      var pos=recent.lastIndexOf(key);

      if(pos===-1) return 12;            // not seen recently
      var age=recent.length-1-pos;
      if(age<=2) return 1;               // very recent
      if(age<=5) return 2;
      if(age<=11) return 4;
      return 7;
    });

    var total=weights.reduce(function(a,b){return a+b},0);
    var roll=Math.random()*total;
    var index=0;
    for(;index<weights.length;index++){
      roll-=weights[index];
      if(roll<=0) break;
    }
    if(index>=working.length) index=working.length-1;

    picked.push(working[index]);
    working.splice(index,1);
  }

  var updated=recent.concat(picked.map(activityKey));
  saveHistory(updated);
  return picked;
}

function pageUrl(unit,file){
  return pagesBase+encodeURIComponent(unit)+"/"+encodeURIComponent(file);
}

function titleFromFile(file){
  return titles[file] || file.replace(/\.html$/i,"").replace(/-/g," ");
}

function makeUnitSelect(value){
  var row=document.createElement("div");
  row.className="pool-row";

  var select=document.createElement("select");
  select.className="unit-select";
  availableUnits.forEach(function(unit){
    var option=document.createElement("option");
    option.value=unit;
    option.textContent=unit;
    if(unit===value) option.selected=true;
    select.appendChild(option);
  });

  var remove=document.createElement("button");
  remove.type="button";
  remove.className="remove-button";
  remove.textContent="×";
  remove.title="Remove this unit";
  remove.addEventListener("click",function(){
    if(document.querySelectorAll(".unit-select").length===1) return;
    row.remove();
  });

  row.appendChild(select);
  row.appendChild(remove);
  unitRows.appendChild(row);
}

function selectedUnits(){
  var values=[];
  document.querySelectorAll(".unit-select").forEach(function(select){
    if(values.indexOf(select.value)===-1) values.push(select.value);
  });
  return values;
}

async function loadUnitFolders(){
  try{
    var response=await fetch("https://api.github.com/repos/"+owner+"/"+repo+"/contents?ref=main",{
      headers:{Accept:"application/vnd.github+json"}
    });
    if(!response.ok) throw new Error("GitHub request failed");
    var items=await response.json();
    var units=items
      .filter(function(item){return item.type==="dir" && /^Unit\s/i.test(item.name)})
      .map(function(item){return item.name})
      .sort();
    if(units.length) availableUnits=units;
  }catch(err){}
}

async function getActivities(unit){
  var api="https://api.github.com/repos/"+owner+"/"+repo+"/contents/"+encodeURIComponent(unit)+"?ref=main";
  try{
    var response=await fetch(api,{headers:{Accept:"application/vnd.github+json"}});
    if(!response.ok) throw new Error("GitHub request failed");
    var items=await response.json();
    return items
      .filter(function(item){
        return item.type==="file" &&
          /\.html$/i.test(item.name) &&
          item.name.toLowerCase()!=="index.html";
      })
      .map(function(item){return item.name});
  }catch(err){
    return fallback[unit] ? fallback[unit].slice() : [];
  }
}

function renderRound(items){
  grid.innerHTML="";
  items.forEach(function(item,i){
    var card=document.createElement("div");
    card.className="card";

    var num=document.createElement("div");
    num.className="number";
    num.textContent=String(i+1);

    var qr=document.createElement("div");
    qr.className="qr";

    var name=document.createElement("div");
    name.className="name";
    name.textContent=titleFromFile(item.file);

    var cedText=document.createElement("div");
    cedText.className="ced";
    cedText.textContent=ced[item.file] || "CED mapping not set";

    var small=document.createElement("div");
    small.className="small";
    small.textContent=item.unit;

    card.appendChild(num);
    card.appendChild(qr);
    card.appendChild(name);
    card.appendChild(cedText);
    card.appendChild(small);
    grid.appendChild(card);

    new QRCode(qr,{
      text:pageUrl(item.unit,item.file),
      width:250,
      height:250,
      correctLevel:QRCode.CorrectLevel.M
    });
  });
}

async function generateRound(){
  var units=selectedUnits();
  var count=parseInt(activityCount.value,10);
  if(!Number.isFinite(count)) count=3;
  count=Math.max(1,Math.min(12,count));
  activityCount.value=String(count);

  generateButton.disabled=true;
  status.textContent="Loading activities…";
  grid.innerHTML="";

  var lists=await Promise.all(units.map(async function(unit){
    var files=await getActivities(unit);
    return files.map(function(file){return {unit:unit,file:file}});
  }));

  var pool=[];
  lists.forEach(function(list){pool=pool.concat(list)});

  if(pool.length===0){
    status.textContent="";
    grid.innerHTML="<div class='empty'>The selected unit folder"+(units.length>1?"s do":" does")+" not contain any activities yet.</div>";
    generateButton.disabled=false;
    return;
  }

  if(count>pool.length) count=pool.length;
  activityCount.value=String(count);

  var picked=weightedPickWithoutReplacement(pool,count);
  renderRound(picked);

  ruleText.textContent="First person to show 5/5 on all "+count+" "+(count===1?"activity":"activities")+" wins.";
  status.textContent="Selected "+count+" of "+pool.length+" activities from "+units.join(" + ")+", with a strong preference against recently used activities.";
  generateButton.disabled=false;
}

addUnitButton.addEventListener("click",function(){
  var chosen=selectedUnits();
  var next=availableUnits.find(function(unit){return chosen.indexOf(unit)===-1}) || availableUnits[0];
  makeUnitSelect(next);
});

generateButton.addEventListener("click",generateRound);

activityCount.addEventListener("change",function(){
  var n=parseInt(activityCount.value,10);
  if(!Number.isFinite(n)) n=3;
  n=Math.max(1,Math.min(12,n));
  activityCount.value=String(n);
});

(async function init(){
  await loadUnitFolders();
  makeUnitSelect(availableUnits[0] || "Unit 1A");
  generateRound();
})();
})();
</script>
</body>
</html>
