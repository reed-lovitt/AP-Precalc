<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do Now Challenge</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}
.page{max-width:1200px;margin:26px auto 40px;padding:0 24px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:18px}
h1{margin:0 0 5px;font-size:32px}
.subtitle{font-size:17px;color:#555}
.controls{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin:20px 0 24px}
.control{display:flex;flex-direction:column;gap:6px}
label{font-size:14px;font-weight:700}
select,button{
  font:inherit;
  border:1.25px solid #111;
  background:#fff;
  padding:10px 12px;
  min-height:44px;
}
select{min-width:180px}
button{cursor:pointer;padding-left:18px;padding-right:18px}
button:hover{background:#f2f2f2}
button:disabled{opacity:.45;cursor:not-allowed}
.rule{
  border:1.4px solid #111;
  padding:13px 16px;
  margin-bottom:22px;
  font-size:18px;
  font-weight:700;
  text-align:center
}
.status{min-height:24px;color:#555;margin:-8px 0 15px;font-size:15px}
.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:18px
}
.card{
  border:1.4px solid #111;
  border-radius:9px;
  min-height:390px;
  padding:20px 18px 18px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  text-align:center
}
.number{
  width:30px;height:30px;border:1.2px solid #111;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;margin-bottom:12px
}
.qr{
  width:250px;height:250px;
  display:flex;align-items:center;justify-content:center;
  margin:2px auto 14px
}
.qr img,.qr canvas{max-width:100%;height:auto}
.name{
  font-size:19px;
  font-weight:700;
  line-height:1.25;
  overflow-wrap:anywhere
}
.empty{
  grid-column:1/-1;
  border:1.4px solid #111;
  padding:36px;
  text-align:center;
  font-size:18px
}
.small{font-size:13px;color:#666;margin-top:7px}
@media(max-width:900px){
  .grid{grid-template-columns:1fr}
  .card{min-height:0}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="page">
  <div class="top">
    <div>
      <h1>Do Now Challenge</h1>
      <div class="subtitle">Three random practice activities from the selected unit.</div>
    </div>
  </div>

  <div class="controls">
    <div class="control">
      <label for="unitSelect">Unit</label>
      <select id="unitSelect">
        <option value="Unit 1A">Unit 1A</option>
        <option value="Unit 1B">Unit 1B</option>
      </select>
    </div>
    <button id="generateButton" type="button">Generate Round</button>
  </div>

  <div class="rule">First person to show 5/5 on all three activities wins.</div>
  <div class="status" id="status"></div>
  <div class="grid" id="grid"></div>
</div>

<script>
(function(){
"use strict";

var owner="reed-lovitt";
var repo="AP-Precalc";
var pagesBase="https://reed-lovitt.github.io/AP-Precalc/";
var unitSelect=document.getElementById("unitSelect");
var generateButton=document.getElementById("generateButton");
var grid=document.getElementById("grid");
var status=document.getElementById("status");

var fallback={
  "Unit 1A":[
    "Compare-ROC-Graph.html",
    "Complex-Conjugate-Zeros.html",
    "Even-Odd-Graph.html",
    "Interval-Practice.html",
    "Minimum-Polynomial-Degree.html",
    "Polynomial-Degree-Leading-Coefficient.html",
    "Polynomial-Degree-Table.html",
    "Polynomial-Degree-from-Factors.html",
    "Polynomial-End-Behavior-Expression.html",
    "Polynomial-End-Behavior.html",
    "Polynomial-Global-Extrema.html",
    "Polynomial-Graph-to-Equation.html",
    "ROC-Graph.html",
    "ROC-Patterns-Table.html",
    "ROC-Table.html",
    "Rate-of-change-and-concavity.html"
  ],
  "Unit 1B":[]
};

function shuffle(a){
  a=a.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}

function titleFromFile(file){
  var s=file.replace(/\.html$/i,"").replace(/-/g," ");
  return s.replace(/\bROC\b/g,"Rate of Change");
}

function pageUrl(unit,file){
  return pagesBase+encodeURIComponent(unit)+"/"+encodeURIComponent(file);
}

async function getActivities(unit){
  var api="https://api.github.com/repos/"+owner+"/"+repo+"/contents/"+encodeURIComponent(unit)+"?ref=main";
  try{
    var response=await fetch(api,{headers:{Accept:"application/vnd.github+json"}});
    if(!response.ok) throw new Error("GitHub request failed");
    var items=await response.json();
    return items
      .filter(function(item){
        return item.type==="file" &&
          /\.html$/i.test(item.name) &&
          item.name.toLowerCase()!=="index.html";
      })
      .map(function(item){return item.name});
  }catch(err){
    return fallback[unit] ? fallback[unit].slice() : [];
  }
}

function renderRound(unit,files){
  grid.innerHTML="";
  files.forEach(function(file,i){
    var card=document.createElement("div");
    card.className="card";

    var num=document.createElement("div");
    num.className="number";
    num.textContent=String(i+1);

    var qr=document.createElement("div");
    qr.className="qr";

    var name=document.createElement("div");
    name.className="name";
    name.textContent=titleFromFile(file);

    var small=document.createElement("div");
    small.className="small";
    small.textContent=unit;

    card.appendChild(num);
    card.appendChild(qr);
    card.appendChild(name);
    card.appendChild(small);
    grid.appendChild(card);

    new QRCode(qr,{
      text:pageUrl(unit,file),
      width:250,
      height:250,
      correctLevel:QRCode.CorrectLevel.M
    });
  });
}

async function generateRound(){
  var unit=unitSelect.value;
  generateButton.disabled=true;
  status.textContent="Loading activities…";
  grid.innerHTML="";

  var files=await getActivities(unit);

  if(files.length<3){
    status.textContent="";
    grid.innerHTML="<div class='empty'>"+unit+" does not have at least three activities yet.</div>";
    generateButton.disabled=false;
    return;
  }

  var picked=shuffle(files).slice(0,3);
  renderRound(unit,picked);
  status.textContent="Randomly selected 3 of "+files.length+" activities in "+unit+".";
  generateButton.disabled=false;
}

generateButton.addEventListener("click",generateRound);
unitSelect.addEventListener("change",generateRound);

generateRound();
})();
</script>
</body>
</html>
