<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Even and Odd Function Value Practice</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}
.page{max-width:900px;margin:28px auto;padding:0 18px}
h1{margin:0 0 8px;font-size:30px}
.subtitle{font-size:17px;color:#444;margin-bottom:18px}
.topbar{display:flex;justify-content:flex-end;margin-bottom:18px}
.score{font-size:17px}
.problem-box{border:1.5px solid #111;padding:22px}
.function-type{font-size:18px;margin-bottom:6px}
.question{font-size:22px;font-weight:700;margin-bottom:8px}
#graph{width:100%;height:420px;display:block;margin:6px 0 18px}
.choices{display:grid;grid-template-columns:1fr;gap:10px}
.choice{border:1.5px solid #111;padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;background:#fff}
.choice:hover{background:#f2f2f2}
.choice input{transform:scale(1.15);margin:0}
.choice-letter{font-weight:700;min-width:24px}
.choice-value{font-family:"Times New Roman",Times,serif;font-size:25px}
.button-row{margin-top:18px}
button{font-size:17px;padding:11px 18px;border:1.5px solid #111;background:#fff;cursor:pointer}
button:hover{background:#ededed}
#feedback{min-height:30px;margin-top:16px;font-size:19px;font-weight:700}
.correct{color:#16752b}
.incorrect{color:#b52222}
@media(max-width:650px){
  .page{padding:0 12px;margin-top:18px}
  .problem-box{padding:16px}
  h1{font-size:27px}
  #graph{height:330px}
}
</style>
</head>
<body>
<div class="page">
  <h1>Even and Odd Function Practice</h1>
  <div class="subtitle">Use the graph and symmetry to find the requested function value.</div>

  <div class="topbar">
    <div class="score">Score: <span id="correctCount">0</span> / <span id="attemptCount">0</span></div>
  </div>

  <div class="problem-box">
    <div class="function-type" id="functionType"></div>
    <div class="question" id="promptText"></div>

    <svg id="graph" viewBox="0 0 800 420" aria-label="coordinate graph"></svg>

    <form class="choices">
      <label class="choice"><input type="radio" name="choice" value="0"><span class="choice-letter">A.</span><span class="choice-value" id="choice0"></span></label>
      <label class="choice"><input type="radio" name="choice" value="1"><span class="choice-letter">B.</span><span class="choice-value" id="choice1"></span></label>
      <label class="choice"><input type="radio" name="choice" value="2"><span class="choice-letter">C.</span><span class="choice-value" id="choice2"></span></label>
      <label class="choice"><input type="radio" name="choice" value="3"><span class="choice-letter">D.</span><span class="choice-value" id="choice3"></span></label>
    </form>

    <div class="button-row"><button id="actionButton" type="button">Check Answer</button></div>
    <div id="feedback"></div>
  </div>
</div>

<script>
(function(){
"use strict";

var svg=document.getElementById("graph");
var functionType=document.getElementById("functionType");
var promptText=document.getElementById("promptText");
var actionButton=document.getElementById("actionButton");
var feedback=document.getElementById("feedback");

var answered=false;
var correctCount=0;
var attemptCount=0;
var currentProblem=null;

var GL=85, GR=745, GT=25, GB=365;
var XMIN=-6, XMAX=6, YMIN=-6, YMAX=6;

function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[randInt(0,arr.length-1)]; }

function shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

function svgEl(type,attrs){
  var e=document.createElementNS("http://www.w3.org/2000/svg",type);
  Object.keys(attrs||{}).forEach(function(k){ e.setAttribute(k,attrs[k]); });
  return e;
}

function xp(x){ return GL+(x-XMIN)*(GR-GL)/(XMAX-XMIN); }
function yp(y){ return GB-(y-YMIN)*(GB-GT)/(YMAX-YMIN); }

function addText(x,y,text,attrs){
  var a=attrs||{};
  a.x=x; a.y=y;
  var t=svgEl("text",a);
  t.textContent=text;
  svg.appendChild(t);
}

function drawGrid(){
  var x,y;
  for(x=XMIN;x<=XMAX;x++){
    svg.appendChild(svgEl("line",{
      x1:xp(x),y1:GT,x2:xp(x),y2:GB,
      stroke:x===0?"#111":"#ddd","stroke-width":x===0?2:1
    }));
  }
  for(y=YMIN;y<=YMAX;y++){
    svg.appendChild(svgEl("line",{
      x1:GL,y1:yp(y),x2:GR,y2:yp(y),
      stroke:y===0?"#111":"#ddd","stroke-width":y===0?2:1
    }));
  }
  for(x=XMIN;x<=XMAX;x++){
    if(x!==0){
      addText(xp(x),yp(0)+22,String(x),{
        "text-anchor":"middle","font-size":14,"font-family":"Arial"
      });
    }
  }
  for(y=YMIN;y<=YMAX;y++){
    if(y!==0){
      addText(xp(0)-12,yp(y)+5,String(y),{
        "text-anchor":"end","font-size":14,"font-family":"Arial"
      });
    }
  }
}

function addFilledPoint(x,y){
  svg.appendChild(svgEl("circle",{cx:xp(x),cy:yp(y),r:6,fill:"#111"}));
}

function addOpenPoint(x,y){
  svg.appendChild(svgEl("circle",{
    cx:xp(x),cy:yp(y),r:8,fill:"#fff",stroke:"#111","stroke-width":3
  }));
}

function addPolyline(points){
  svg.appendChild(svgEl("polyline",{
    points:points.map(function(p){return xp(p[0])+","+yp(p[1]);}).join(" "),
    fill:"none",stroke:"#111","stroke-width":3.5,
    "stroke-linejoin":"round","stroke-linecap":"round"
  }));
}

function yForParity(type,y){
  return type==="even" ? y : -y;
}

function makeChoices(answer,givenY,holeQuestion){
  var pool=[];
  function add(v){
    var key=String(v);
    if(String(answer)!==key && pool.map(String).indexOf(key)===-1) pool.push(v);
  }

  if(givenY!==null){
    add(givenY);
    add(-givenY);
  }
  add(0);
  if(holeQuestion) add("undefined");
  add(answer+1);
  add(answer-1);
  add(1);
  add(-1);

  while(pool.length<3){
    add(randInt(-6,6));
  }

  return shuffle([
    {value:answer,correct:true},
    {value:pool[0],correct:false},
    {value:pool[1],correct:false},
    {value:pool[2],correct:false}
  ]);
}

function makeProblem(){
  var type=Math.random()<0.5 ? "even" : "odd";
  var holeQuestion=Math.random()<0.5;

  // Fixed visible domains:
  // left piece:  -3 < x <= 0
  // right piece:  3 < x <= 6
  // Both x=±3 endpoints are always open.
  // Interior x-values are distinct, so no segment can be vertical.

  var leftMidX=pick([-2,-1]);
  var rightMidX=pick([4,5]);

  var leftOpenY=randInt(-4,4);
  var leftMidY=randInt(-5,5);
  var leftEndY=type==="odd" ? 0 : randInt(-5,5);

  var rightOpenY=randInt(-4,4);
  var rightMidY=randInt(-5,5);
  var rightEndY=randInt(-5,5);

  var left=[[-3,leftOpenY],[leftMidX,leftMidY],[0,leftEndY]];
  var right=[[3,rightOpenY],[rightMidX,rightMidY],[6,rightEndY]];

  var givenX,givenY,askX,answer;

  if(holeQuestion){
    // Since x=±3 are holes, the corresponding function value is undefined.
    givenX=Math.random()<0.5 ? 3 : -3;
    askX=-givenX;
    givenY=null;
    answer="undefined";
  }else{
    var displayed=pick([
      [leftMidX,leftMidY],
      [0,leftEndY],
      [rightMidX,rightMidY],
      [6,rightEndY]
    ]);

    // Avoid asking for f(0) in odd problems because it is trivially 0.
    if(type==="odd" && displayed[0]===0){
      displayed=pick([
        [leftMidX,leftMidY],
        [rightMidX,rightMidY],
        [6,rightEndY]
      ]);
    }

    givenX=displayed[0];
    givenY=displayed[1];
    askX=-givenX;
    answer=type==="even" ? givenY : -givenY;
  }

  return {
    type:type,
    holeQuestion:holeQuestion,
    left:left,
    right:right,
    givenX:givenX,
    givenY:givenY,
    askX:askX,
    answer:answer,
    choices:makeChoices(answer,givenY,holeQuestion)
  };
}
function drawProblem(p){
  svg.innerHTML="";
  drawGrid();

  addPolyline(p.left);
  addPolyline(p.right);

  // Left piece: open at x=-3, closed at x=0.
  addOpenPoint(p.left[0][0],p.left[0][1]);
  addFilledPoint(p.left[1][0],p.left[1][1]);
  addFilledPoint(p.left[2][0],p.left[2][1]);

  // Right piece: open at x=3, closed at x=6.
  addOpenPoint(p.right[0][0],p.right[0][1]);
  addFilledPoint(p.right[1][0],p.right[1][1]);
  addFilledPoint(p.right[2][0],p.right[2][1]);
}
function renderChoices(p){
  var radios=document.querySelectorAll('input[name="choice"]');
  p.choices.forEach(function(c,i){
    document.getElementById("choice"+i).textContent=c.value;
    radios[i].checked=false;
    radios[i].dataset.correct=c.correct?"true":"false";
  });
}

function newProblem(){
  currentProblem=makeProblem();
  answered=false;
  feedback.textContent="";
  feedback.className="";
  actionButton.textContent="Check Answer";

  functionType.innerHTML='The function <i>f</i> is an <b>'+currentProblem.type+'</b> function.';
  promptText.innerHTML='Find <i>f</i>('+currentProblem.askX+').';

  drawProblem(currentProblem);
  renderChoices(currentProblem);
}

function checkAnswer(){
  if(answered) return;
  var selected=document.querySelector('input[name="choice"]:checked');

  if(!selected){
    feedback.textContent="Select an answer choice first.";
    feedback.className="incorrect";
    return;
  }

  answered=true;
  attemptCount++;

  if(selected.dataset.correct==="true"){
    correctCount++;
    feedback.textContent="Correct!";
    feedback.className="correct";
  }else{
    feedback.textContent="Not quite.";
    feedback.className="incorrect";
  }

  document.getElementById("correctCount").textContent=correctCount;
  document.getElementById("attemptCount").textContent=attemptCount;
  actionButton.textContent="New Question";
}

actionButton.addEventListener("click",function(){
  if(answered) newProblem();
  else checkAnswer();
});

newProblem();
})();
</script>
</body>
</html>
