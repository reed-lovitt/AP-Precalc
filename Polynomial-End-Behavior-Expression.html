<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polynomial End Behavior from an Expression</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}
.page{max-width:940px;margin:26px auto 40px;padding:0 20px}
.header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:18px}
h1{margin:0 0 5px;font-size:29px}
.subtitle{font-size:16px;color:#555}
.right-status{display:flex;align-items:center;gap:18px;white-space:nowrap}
.clock{font-size:15px;color:#444;text-align:right;line-height:1.15}
.score{font-size:17px;white-space:nowrap}
.card{border:1.4px solid #111;padding:24px 26px 26px}
.prompt{font-size:19px;line-height:1.55;margin-bottom:22px}
.prompt mjx-container,.choice-text mjx-container{margin:0 !important}
.choices{display:grid;gap:12px}
.choice{
  border:1.25px solid #222;
  border-radius:9px;
  min-height:62px;
  padding:12px 15px 12px 11px;
  display:grid;
  grid-template-columns:42px 1fr;
  align-items:center;
  background:#fff;
  cursor:pointer;
}
.choice:hover{background:#f7f7f7}
.choice input{position:absolute;opacity:0;pointer-events:none}
.badge{
  width:24px;height:24px;border:1.2px solid #444;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700
}
.choice.selected{box-shadow:inset 0 0 0 1.4px #111}
.choice.selected .badge{background:#111;color:#fff}
.choice-text{font-size:19px;line-height:1.35}
.controls{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:18px}
button{font-size:16px;padding:10px 17px;border:1.25px solid #111;background:#fff;cursor:pointer}
button:hover{background:#f2f2f2}
#feedback{min-height:24px;font-size:18px;font-weight:700}
.correct{color:#1f7a31}
.incorrect{color:#b52222}
@media(max-width:650px){
  .page{padding:0 12px;margin-top:14px}
  .header{align-items:flex-start}
  .right-status{gap:10px}
  .card{padding:17px}
  h1{font-size:25px}
  .prompt{font-size:17px}
  .choice-text{font-size:18px}
}
</style>
<script>
window.MathJax={tex:{inlineMath:[['\\(','\\)']]},chtml:{scale:1}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
<div class="page">
  <div class="header">
    <div>
      <h1>Polynomial End Behavior Practice</h1>
      <div class="subtitle">Identify end behavior from a polynomial written in a nonstandard order.</div>
    </div>
    <div class="right-status">
      <div class="clock"><span id="dateDisplay"></span> <span id="timeDisplay"></span></div>
      <div class="score">Score: <span id="correctCount">0</span> / <span id="attemptCount">0</span></div>
    </div>
  </div>

  <div class="card">
    <div class="prompt" id="promptText"></div>
    <form class="choices" id="choices"></form>
    <div class="controls">
      <button id="actionButton" type="button">Check Answer</button>
      <div id="feedback"></div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

var answered=false;
var correctCount=0;
var attemptCount=0;

function updateClock(){
  var now=new Date();
  document.getElementById("dateDisplay").textContent=(now.getMonth()+1)+"/"+now.getDate();
  document.getElementById("timeDisplay").textContent=now.toLocaleTimeString(undefined,{
    hour:"numeric",minute:"2-digit",second:"2-digit"
  });
}
updateClock();
setInterval(updateClock,1000);

function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function pick(a){return a[randInt(0,a.length-1)]}
function shuffle(a){
  a=a.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}
function typeset(target){
  function run(){
    if(window.MathJax && MathJax.typesetPromise){
      MathJax.typesetPromise(target?[target]:undefined);
    }
  }
  if(window.MathJax && MathJax.startup && MathJax.startup.promise){
    MathJax.startup.promise.then(run);
  }else{
    setTimeout(run,100);
  }
}
function coeffTex(n){
  if(Math.abs(n)===1) return n<0?"-":"";
  if(Math.random()<0.22){
    var den=pick([2,3,4,5]);
    var num=Math.abs(n);
    return (n<0?"-":"")+"\\frac{"+num+"}{"+den+"}";
  }
  return String(n);
}
function termTex(c,e){
  if(e===0) return String(c);
  var coeff=coeffTex(c);
  if(e===1) return coeff+"x";
  return coeff+"x^{"+e+"}";
}
function polynomialTex(){
  var degree=randInt(3,8);
  var leadingCoeff=pick([-7,-5,-3,-2,2,3,5,7]);
  var exponents=[degree];
  while(exponents.length<4){
    var e=randInt(0,degree-1);
    if(exponents.indexOf(e)===-1) exponents.push(e);
  }

  var terms=exponents.map(function(e,i){
    var c=i===0?leadingCoeff:pick([-11,-9,-7,-5,-3,-2,2,3,5,7,9,11]);
    return {c:c,e:e,tex:termTex(c,e)};
  });

  // Guarantee the actual leading term is not shown first.
  var lead=terms[0];
  var rest=shuffle(terms.slice(1));
  var insertAt=randInt(1,rest.length);
  var ordered=rest.slice(0,insertAt).concat([lead],rest.slice(insertAt));

  var tex="";
  ordered.forEach(function(t,i){
    var s=t.tex;
    if(i===0){
      tex=s;
    }else if(s.charAt(0)==="-"){
      tex+=" - "+s.slice(1);
    }else{
      tex+=" + "+s;
    }
  });

  return {tex:tex,degree:degree,leadingCoeff:leadingCoeff};
}
function makeProblem(){
  var p=polynomialTex();
  var positiveRight=p.leadingCoeff>0;
  var correct=positiveRight?"posRight":"negRight";

  var prompt=
    "The function \\(f\\) is given by \\(f(x)="+p.tex+"\\). "+
    "Which of the following correctly describes the end behavior of \\(f\\) as the input values increase without bound?";

  var answers=[
    {key:"posRight",text:"\\(\\displaystyle \\lim_{x\\to\\infty} f(x)=\\infty\\)"},
    {key:"negRight",text:"\\(\\displaystyle \\lim_{x\\to\\infty} f(x)=-\\infty\\)"},
    {key:"posLeft",text:"\\(\\displaystyle \\lim_{x\\to-\\infty} f(x)=\\infty\\)"},
    {key:"negLeft",text:"\\(\\displaystyle \\lim_{x\\to-\\infty} f(x)=-\\infty\\)"}
  ].map(function(a){
    return {text:a.text,correct:a.key===correct};
  });

  return {prompt:prompt,answers:answers};
}
function renderChoices(p){
  var form=document.getElementById("choices");
  form.innerHTML="";
  var letters=["A","B","C","D"];
  p.answers.forEach(function(a,i){
    var label=document.createElement("label");
    label.className="choice";
    label.innerHTML=
      "<input type='radio' name='choice' value='"+i+"'>"+
      "<span class='badge'>"+letters[i]+"</span>"+
      "<span class='choice-text'>"+a.text+"</span>";
    var input=label.querySelector("input");
    input.dataset.correct=a.correct?"true":"false";
    label.addEventListener("click",function(){
      document.querySelectorAll(".choice").forEach(function(el){el.classList.remove("selected")});
      label.classList.add("selected");
      input.checked=true;
    });
    form.appendChild(label);
  });
}
function newProblem(){
  answered=false;
  var p=makeProblem();
  document.getElementById("feedback").textContent="";
  document.getElementById("feedback").className="";
  document.getElementById("actionButton").textContent="Check Answer";
  document.getElementById("promptText").innerHTML=p.prompt;
  renderChoices(p);
  typeset(document.querySelector(".card"));
}
function checkAnswer(){
  if(answered)return;
  var selected=document.querySelector("input[name='choice']:checked");
  var feedback=document.getElementById("feedback");
  if(!selected){
    feedback.textContent="Select an answer choice first.";
    feedback.className="incorrect";
    return;
  }
  answered=true;
  attemptCount++;
  if(selected.dataset.correct==="true"){
    correctCount++;
    feedback.textContent="Correct!";
    feedback.className="correct";
  }else{
    feedback.textContent="Not quite.";
    feedback.className="incorrect";
  }
  document.getElementById("correctCount").textContent=correctCount;
  document.getElementById("attemptCount").textContent=attemptCount;
  document.getElementById("actionButton").textContent="New Question";
}
document.getElementById("actionButton").addEventListener("click",function(){
  answered?newProblem():checkAnswer();
});
newProblem();
})();
</script>
</body>
</html>
