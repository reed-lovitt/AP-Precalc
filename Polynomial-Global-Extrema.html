<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polynomial Global Extrema Practice</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}
.page{max-width:940px;margin:26px auto 40px;padding:0 20px}
.header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:18px}
h1{margin:0 0 5px;font-size:29px}
.subtitle{font-size:16px;color:#555}
.score{font-size:17px;white-space:nowrap}
.card{border:1.4px solid #111;padding:24px 26px 26px}
.prompt{font-size:19px;line-height:1.5;margin-bottom:22px}
.choices{display:grid;gap:12px}
.choice{
  border:1.25px solid #222;
  border-radius:9px;
  min-height:62px;
  padding:12px 15px 12px 11px;
  display:grid;
  grid-template-columns:42px 1fr;
  align-items:center;
  background:#fff;
  cursor:pointer;
}
.choice:hover{background:#f7f7f7}
.choice input{position:absolute;opacity:0;pointer-events:none}
.badge{
  width:24px;height:24px;border:1.2px solid #444;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700
}
.choice.selected{box-shadow:inset 0 0 0 1.4px #111}
.choice.selected .badge{background:#111;color:#fff}
.choice-text{font-size:18px;line-height:1.4}
.prompt mjx-container,.choice-text mjx-container{margin:0 !important}
.controls{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:18px}
button{font-size:16px;padding:10px 17px;border:1.25px solid #111;background:#fff;cursor:pointer}
button:hover{background:#f2f2f2}
#feedback{min-height:24px;font-size:18px;font-weight:700}
.correct{color:#1f7a31}
.incorrect{color:#b52222}
@media(max-width:650px){
  .page{padding:0 12px;margin-top:14px}
  .header{align-items:flex-start}
  .card{padding:17px}
  h1{font-size:25px}
  .prompt{font-size:17px}
  .choice-text{font-size:17px}
}
</style>
<script>
window.MathJax={
  tex:{inlineMath:[['\\(','\\)']]},
  chtml:{scale:1}
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
<div class="page">
  <div class="header">
    <div>
      <h1>Polynomial Global Extrema Practice</h1>
      <div class="subtitle">Use degree parity and the sign of the leading coefficient to determine global extrema.</div>
    </div>
    <div class="score">Score: <span id="correctCount">0</span> / <span id="attemptCount">0</span></div>
  </div>

  <div class="card">
    <div class="prompt" id="promptText"></div>
    <form class="choices" id="choices"></form>
    <div class="controls">
      <button id="actionButton" type="button">Check Answer</button>
      <div id="feedback"></div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

var answered=false;
var correctCount=0;
var attemptCount=0;
var current=null;

function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function pick(a){return a[randInt(0,a.length-1)]}
function shuffle(a){
  a=a.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}

function explicitPolynomial(degree){
  var letters=["b","c","d","e","k","m","n"];
  var terms=["ax^{"+degree+"}"];
  var power=degree-1;
  var idx=0;
  while(power>=1 && idx<4){
    terms.push(letters[idx]+"x^{"+power+"}");
    power--;
    idx++;
  }
  terms.push(letters[Math.min(idx,letters.length-1)]);
  return terms.join("+");
}

function makeProblem(){
  var roll=Math.random();
  var even = roll<0.80;
  var positive = Math.random()<0.5;

  var degree;
  if(even) degree=pick([4,6,8]);
  else degree=pick([3,5,7]);

  var abstractMode=Math.random()<0.15;
  var expression;
  if(abstractMode){
    expression="f(x)=ax^n+\\cdots";
  }else{
    expression="f(x)="+explicitPolynomial(degree);
  }

  var condition;
  if(abstractMode){
    condition="n\\text{ is "+(even?"even":"odd")+"},\\quad a"+(positive?">0":"<0");
  }else{
    condition="a"+(positive?">0":"<0");
  }

  var correct;
  if(!even){
    correct="neither";
  }else if(positive){
    correct="minOnly";
  }else{
    correct="maxOnly";
  }

  var answers=shuffle([
    {key:"both",text:"\\(f\\) has both a global maximum and a global minimum."},
    {key:"maxOnly",text:"\\(f\\) has a global maximum but no global minimum."},
    {key:"minOnly",text:"\\(f\\) has a global minimum but no global maximum."},
    {key:"neither",text:"\\(f\\) has neither a global maximum nor a global minimum."}
  ]).map(function(a){
    a.correct=a.key===correct;
    return a;
  });

  return {expression:expression,condition:condition,answers:answers};
}

function renderChoices(p){
  var form=document.getElementById("choices");
  form.innerHTML="";
  var letters=["A","B","C","D"];
  p.answers.forEach(function(a,i){
    var label=document.createElement("label");
    label.className="choice";
    label.innerHTML="<input type='radio' name='choice' value='"+i+"'>"+
      "<span class='badge'>"+letters[i]+"</span>"+
      "<span class='choice-text'>"+a.text+"</span>";
    label.querySelector("input").dataset.correct=a.correct?"true":"false";
    label.addEventListener("click",function(){
      document.querySelectorAll(".choice").forEach(function(el){el.classList.remove("selected")});
      label.classList.add("selected");
    });
    form.appendChild(label);
  });
}

function typeset(target){
  if(window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([target]);
}

function newProblem(){
  answered=false;
  current=makeProblem();
  document.getElementById("feedback").textContent="";
  document.getElementById("feedback").className="";
  document.getElementById("actionButton").textContent="Check Answer";

  document.getElementById("promptText").innerHTML=
    "The polynomial function \\(f\\) is given by \\("+current.expression+"\\), where \\("+current.condition+"\\). "+
    "Which of the following statements about \\(f\\) is true?";

  renderChoices(current);
  typeset(document.querySelector(".card"));
}

function checkAnswer(){
  if(answered)return;
  var selected=document.querySelector("input[name='choice']:checked");
  var feedback=document.getElementById("feedback");
  if(!selected){
    feedback.textContent="Select an answer choice first.";
    feedback.className="incorrect";
    return;
  }
  answered=true;
  attemptCount++;
  if(selected.dataset.correct==="true"){
    correctCount++;
    feedback.textContent="Correct!";
    feedback.className="correct";
  }else{
    feedback.textContent="Not quite.";
    feedback.className="incorrect";
  }
  document.getElementById("correctCount").textContent=correctCount;
  document.getElementById("attemptCount").textContent=attemptCount;
  document.getElementById("actionButton").textContent="New Question";
}

document.getElementById("actionButton").addEventListener("click",function(){
  answered?newProblem():checkAnswer();
});
newProblem();
})();
</script>
</body>
</html>
