<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polynomial Graph to Equation Practice</title>
<style>
:root{
  --ink:#111;
  --muted:#555;
  --line:#222;
  --soft:#f7f7f7;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:#fff;
  color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;
}
.page{
  max-width:980px;
  margin:24px auto 40px;
  padding:0 22px;
}
.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
  margin-bottom:16px;
}
h1{
  margin:0 0 4px;
  font-size:29px;
  font-weight:700;
}
.subtitle{
  font-size:16px;
  color:var(--muted);
}
.score{
  font-size:17px;
  white-space:nowrap;
}
.card{
  border:1.4px solid #111;
  padding:22px 26px 26px;
}
.graph-title{
  font-family:"Times New Roman",Times,serif;
  font-size:18px;
  text-align:center;
  margin:0 0 6px;
}
.graph-wrap{
  display:flex;
  justify-content:center;
  margin:2px 0 14px;
}
svg{
  width:min(100%,560px);
  height:auto;
  display:block;
}
.prompt{
  font-size:18px;
  line-height:1.45;
  margin:6px auto 18px;
  max-width:800px;
}
.math{
  font-family:"Cambria Math","Times New Roman",serif;
  font-size:1.04em;
}
.var{
  font-style:italic;
}
.choices{
  display:grid;
  gap:12px;
}
.choice{
  position:relative;
  display:grid;
  grid-template-columns:42px 1fr;
  align-items:center;
  min-height:62px;
  padding:10px 16px 10px 10px;
  border:1.25px solid #222;
  border-radius:9px;
  background:#fff;
  cursor:pointer;
}
.choice:hover{background:#fafafa}
.choice input{
  position:absolute;
  opacity:0;
  pointer-events:none;
}
.badge{
  width:24px;
  height:24px;
  border:1.2px solid #444;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial,Helvetica,sans-serif;
  font-size:13px;
  font-weight:700;
  margin-left:1px;
}
.choice.selected{
  box-shadow:inset 0 0 0 1.4px #111;
}
.choice.selected .badge{
  background:#111;
  color:#fff;
}
.choice-text{
  font-size:22px;
  line-height:1.3;
  display:flex;
  align-items:center;
  min-height:40px;
}
.choice-text mjx-container{
  margin:0 !important;
  font-size:1.08em !important;
}
.controls{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  margin-top:18px;
}
button{
  border:1.25px solid #111;
  background:#fff;
  padding:10px 17px;
  font-size:16px;
  cursor:pointer;
}
button:hover{background:#f2f2f2}
#feedback{
  min-height:24px;
  font-size:18px;
  font-weight:700;
}
.correct{color:#1f7a31}
.incorrect{color:#b52222}
@media(max-width:650px){
  .page{padding:0 12px;margin-top:14px}
  .header{align-items:flex-start}
  .card{padding:16px}
  h1{font-size:25px}
  .prompt{font-size:17px}
  .choice-text{font-size:19px}
}

/* Shared answer-choice polish */
.choices{gap:12px !important}
.choice,label.choice{
  border:1.25px solid #222 !important;
  border-radius:9px !important;
  padding:12px 14px !important;
  min-height:60px;
  background:#fff !important;
  align-items:center !important;
}
.choice:hover,label.choice:hover{background:#f7f7f7 !important}
.choice input{margin:0 2px 0 0}
.choice-letter{min-width:24px;font-weight:700}
.choice-text,.choice-value,.choice-math{line-height:1.3}
.choice-math,.choice-text mjx-container,.choice-math mjx-container{
  font-size:1.08em !important;
}
mjx-container{margin:0 !important}

</style>
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(','\\)']] },
  svg: { fontCache: 'global' }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
<div class="page">
  <div class="header">
    <div>
      <h1>Polynomial Graph to Equation Practice</h1>
      <div class="subtitle">Use zeros, multiplicity, and end behavior to match a polynomial to its graph.</div>
    </div>
    <div class="score">Score: <span id="correctCount">0</span> / <span id="attemptCount">0</span></div>
  </div>

  <div class="card">
    <div class="graph-wrap">
      <svg id="graph" viewBox="0 0 560 330" aria-label="Graph of polynomial"></svg>
    </div>
    <div class="graph-title">Graph of <span class="math"><span class="var">P</span></span></div>

    <div class="prompt">
      The graph of the polynomial function <span class="math"><span class="var">y</span> = <span class="var">P</span>(<span class="var">x</span>)</span> is shown.
      Which of the following could define <span class="math"><span class="var">P</span>(<span class="var">x</span>)</span>?
    </div>

    <form class="choices" id="choices"></form>

    <div class="controls">
      <button type="button" id="actionButton">Check Answer</button>
      <div id="feedback"></div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

var answered=false;
var correctCount=0;
var attemptCount=0;
var current=null;

function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function pick(a){return a[randInt(0,a.length-1)];}
function shuffle(a){
  a=a.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}

function factorTeX(root,mult){
  var sign=root>=0 ? "-" : "+";
  var n=Math.abs(root);
  var core="(x "+sign+" "+n+")";
  return mult===2 ? core+"^2" : core;
}

function formulaTeX(simpleRoot,doubleRoot,lead,den){
  var num=(lead===-1 ? "-" : "")+factorTeX(simpleRoot,1)+factorTeX(doubleRoot,2);
  if(den===1) return "\\(\\displaystyle P(x)="+num+"\\)";
  return "\\(\\displaystyle P(x)=\\frac{"+num+"}{"+den+"}\\)";
}

function makeProblem(){
  var roots=[
    [-4,3],[-3,4],[-3,2],[-2,4],[-4,2],
    [3,-4],[4,-3],[2,-3],[4,-2],[2,-4]
  ];
  var pair=pick(roots);
  var simpleRoot=pair[0];
  var doubleRoot=pair[1];
  var lead=pick([1,-1]);

  // scale chosen so graph stays readable and AP-like
  var den=pick([6,8,10,12]);

  var correct=formulaTeX(simpleRoot,doubleRoot,lead,den);
  var options=[
    {html:correct,correct:true},
    {html:formulaTeX(doubleRoot,simpleRoot,lead,den),correct:false},
    {html:formulaTeX(-simpleRoot,doubleRoot,lead,den),correct:false},
    {html:formulaTeX(simpleRoot,-doubleRoot,lead,den),correct:false}
  ];

  // occasionally swap end behavior sign for a more meaningful distractor
  if(Math.random()<0.5){
    options[3]={html:formulaTeX(simpleRoot,doubleRoot,-lead,den),correct:false};
  }

  return {
    simpleRoot:simpleRoot,
    doubleRoot:doubleRoot,
    lead:lead,
    den:den,
    choices:shuffle(options)
  };
}

function f(x,p){
  return p.lead*(x-p.simpleRoot)*Math.pow(x-p.doubleRoot,2)/p.den;
}

function renderGraph(p){
  var svg=document.getElementById("graph");
  var W=560,H=330;
  var left=55,right=25,top=20,bottom=42;
  var xmin=-6.5,xmax=6.5,ymin=-5.2,ymax=5.2;
  function X(x){return left+(x-xmin)/(xmax-xmin)*(W-left-right);}
  function Y(y){return top+(ymax-y)/(ymax-ymin)*(H-top-bottom);}

  var parts=[];
  parts.push("<defs><marker id='arrow' markerWidth='7' markerHeight='7' refX='5.5' refY='3.5' orient='auto'><path d='M0,0 L7,3.5 L0,7 Z' fill='#222'/></marker></defs>");

  // axes
  parts.push("<line x1='"+X(xmin)+"' y1='"+Y(0)+"' x2='"+X(xmax)+"' y2='"+Y(0)+"' stroke='#222' stroke-width='1.1' marker-end='url(#arrow)'/>");
  parts.push("<line x1='"+X(0)+"' y1='"+Y(ymin)+"' x2='"+X(0)+"' y2='"+Y(ymax)+"' stroke='#222' stroke-width='1.1' marker-end='url(#arrow)'/>");

  // ticks + labels
  for(var x=-6;x<=6;x++){
    if(x===0) continue;
    parts.push("<line x1='"+X(x)+"' y1='"+(Y(0)-4)+"' x2='"+X(x)+"' y2='"+(Y(0)+4)+"' stroke='#444' stroke-width='.8'/>");
    parts.push("<text x='"+X(x)+"' y='"+(Y(0)+17)+"' text-anchor='middle' font-family='Times New Roman' font-size='12'>"+x+"</text>");
  }
  for(var y=-5;y<=5;y++){
    if(y===0) continue;
    parts.push("<line x1='"+(X(0)-4)+"' y1='"+Y(y)+"' x2='"+(X(0)+4)+"' y2='"+Y(y)+"' stroke='#444' stroke-width='.8'/>");
    parts.push("<text x='"+(X(0)-8)+"' y='"+(Y(y)+4)+"' text-anchor='end' font-family='Times New Roman' font-size='12'>"+y+"</text>");
  }

  parts.push("<text x='"+(X(xmax)-2)+"' y='"+(Y(0)-7)+"' font-family='Times New Roman' font-size='14' font-style='italic'>x</text>");
  parts.push("<text x='"+(X(0)+7)+"' y='"+(Y(ymax)+10)+"' font-family='Times New Roman' font-size='14' font-style='italic'>y</text>");
  parts.push("<text x='"+(X(0)-7)+"' y='"+(Y(0)+16)+"' text-anchor='end' font-family='Times New Roman' font-size='12'>0</text>");

  // curve
  var d="";
  var started=false;
  for(var i=0;i<=500;i++){
    var x=xmin+(xmax-xmin)*i/500;
    var y=f(x,p);
    if(y<ymin-1 || y>ymax+1){
      started=false;
      continue;
    }
    d+=(started?" L ":"M ")+X(x)+" "+Y(y);
    started=true;
  }
  parts.push("<path d='"+d+"' fill='none' stroke='#111' stroke-width='2.25' stroke-linecap='round' stroke-linejoin='round'/>");
  svg.innerHTML=parts.join("");
}

function renderChoices(p){
  var form=document.getElementById("choices");
  form.innerHTML="";
  var letters=["A","B","C","D"];
  p.choices.forEach(function(c,i){
    var lab=document.createElement("label");
    lab.className="choice";
    lab.innerHTML="<input type='radio' name='choice' value='"+i+"'><span class='badge'>"+letters[i]+"</span><span class='choice-text'>"+c.html+"</span>";
    lab.querySelector("input").dataset.correct=c.correct?"true":"false";
    lab.addEventListener("click",function(){
      document.querySelectorAll(".choice").forEach(function(el){el.classList.remove("selected");});
      lab.classList.add("selected");
    });
    form.appendChild(lab);
  });
  if(window.MathJax && MathJax.typesetPromise){
    MathJax.typesetPromise([form]);
  }
}

function newProblem(){
  answered=false;
  current=makeProblem();
  renderGraph(current);
  renderChoices(current);
  document.getElementById("feedback").textContent="";
  document.getElementById("feedback").className="";
  document.getElementById("actionButton").textContent="Check Answer";
}

function checkAnswer(){
  if(answered)return;
  var selected=document.querySelector("input[name='choice']:checked");
  var feedback=document.getElementById("feedback");
  if(!selected){
    feedback.textContent="Select an answer choice first.";
    feedback.className="incorrect";
    return;
  }
  answered=true;
  attemptCount++;
  if(selected.dataset.correct==="true"){
    correctCount++;
    feedback.textContent="Correct!";
    feedback.className="correct";
  }else{
    feedback.textContent="Not quite.";
    feedback.className="incorrect";
  }
  document.getElementById("correctCount").textContent=correctCount;
  document.getElementById("attemptCount").textContent=attemptCount;
  document.getElementById("actionButton").textContent="New Question";
}

document.getElementById("actionButton").addEventListener("click",function(){
  answered?newProblem():checkAnswer();
});
newProblem();
})();
</script>
</body>
</html>
