<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interval Notation Practice</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#fff; color:#111; font-family:Arial,Helvetica,sans-serif; }
  .page { max-width:900px; margin:28px auto; padding:0 18px; }
  h1 { margin:0 0 8px; font-size:30px; }
  .subtitle { font-size:17px; color:#444; margin-bottom:22px; }
  .topbar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:20px; }
  .score { margin-left:auto; font-size:17px; }
  .problem-box { border:1.5px solid #111; padding:22px; }
  .question { font-size:20px; font-weight:700; margin-bottom:12px; }
  #graph { width:100%; height:165px; display:block; margin-bottom:12px; }
  .choices { display:grid; grid-template-columns:1fr; gap:10px; }
  .choice {
    border:1.5px solid #111; padding:12px 14px; display:flex; align-items:center;
    gap:10px; cursor:pointer; background:#fff;
  }
  .choice:hover { background:#f2f2f2; }
  .choice input { transform:scale(1.15); margin:0; }
  .choice-letter { font-weight:700; min-width:24px; }
  .choice-text { font-family:"Times New Roman",Times,serif; font-size:23px; }
  .button-row { display:flex; gap:12px; flex-wrap:wrap; margin-top:18px; }
  button { font-size:17px; padding:11px 18px; border:1.5px solid #111; background:#fff; cursor:pointer; }
  button:hover { background:#ededed; }
  #feedback { min-height:30px; margin-top:16px; font-size:19px; font-weight:700; }
  .correct { color:#16752b; }
  .incorrect { color:#b52222; }
  .note { margin-top:20px; font-size:14px; color:#555; line-height:1.45; }
  @media(max-width:650px){
    .page{padding:0 12px;margin-top:18px}
    .problem-box{padding:16px}
    .score{width:100%;margin-left:0}
    .choice-text{font-size:20px}
    #graph{height:145px}
  }

/* Shared answer-choice polish */
.choices{gap:12px !important}
.choice,label.choice{
  border:1.25px solid #222 !important;
  border-radius:9px !important;
  padding:12px 14px !important;
  min-height:60px;
  background:#fff !important;
  align-items:center !important;
}
.choice:hover,label.choice:hover{background:#f7f7f7 !important}
.choice input{margin:0 2px 0 0}
.choice-letter{min-width:24px;font-weight:700}
.choice-text,.choice-value,.choice-math{line-height:1.3}
.choice-math,.choice-text mjx-container,.choice-math mjx-container{font-size:1.08em !important}
mjx-container{margin:0 !important}

</style>
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(','\\)']] },
  svg: { fontCache: 'global' }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
<div class="page">
  <h1>Interval Notation Practice</h1>
  <div class="subtitle">Choose the interval notation that matches the number line.</div>

  <div class="topbar">
    <div class="score">Score: <span id="correctCount">0</span> / <span id="attemptCount">0</span></div>
  </div>

  <div class="problem-box">
    <div class="question">Which interval notation matches the graph below?</div>

    <svg id="graph" viewBox="0 0 800 165" aria-label="number line">
      <!-- static starter problem so previews still show something -->
      <line x1="80" y1="72" x2="720" y2="72" stroke="#111" stroke-width="3"/>
      <polygon points="80,72 92,65 92,79" fill="#111"/>
      <polygon points="720,72 708,65 708,79" fill="#111"/>

      <line x1="80" y1="72" x2="280" y2="72" stroke="#111" stroke-width="10"/>
      <polygon points="80,72 98,62 98,82" fill="#111"/>
      <line x1="520" y1="72" x2="720" y2="72" stroke="#111" stroke-width="10"/>
      <polygon points="720,72 702,62 702,82" fill="#111"/>

      <circle cx="280" cy="72" r="9" fill="#fff" stroke="#111" stroke-width="3"/>
      <circle cx="520" cy="72" r="9" fill="#111" stroke="#111" stroke-width="3"/>

      <g font-family="Arial" font-size="22" text-anchor="middle">
        <text x="280" y="120">-4</text>
        <text x="520" y="120">7</text>
      </g>
    </svg>

    <form id="choicesForm" class="choices">
      <label class="choice"><input type="radio" name="choice" value="0"><span class="choice-letter">A.</span><span class="choice-text" id="choiceText0">(-∞, -4) ∪ (7, ∞)</span></label>
      <label class="choice"><input type="radio" name="choice" value="1"><span class="choice-letter">B.</span><span class="choice-text" id="choiceText1">(-∞, -4] ∪ (7, ∞)</span></label>
      <label class="choice"><input type="radio" name="choice" value="2"><span class="choice-letter">C.</span><span class="choice-text" id="choiceText2">(-∞, -4) ∪ [7, ∞)</span></label>
      <label class="choice"><input type="radio" name="choice" value="3"><span class="choice-letter">D.</span><span class="choice-text" id="choiceText3">(-∞, -4] ∪ [7, ∞)</span></label>
    </form>

    <div class="button-row">
      <button id="actionButton" type="button">Check Answer</button>
    </div>

    <div id="feedback"></div>


  </div>
</div>

<script>
function typesetMath(target){
  function run(){
    if(window.MathJax && MathJax.typesetPromise){
      MathJax.typesetPromise(target ? [target] : undefined);
    }
  }
  if(window.MathJax && MathJax.startup && MathJax.startup.promise){
    MathJax.startup.promise.then(run);
  }else{
    setTimeout(run,100);
  }
}
let correctCount = 0;
let attemptCount = 0;
let currentProblem = null;
let answered = false;

const svg = document.getElementById("graph");
const feedback = document.getElementById("feedback");

const axisY = 72;
const axisLeft = 80;
const axisRight = 720;

// fixed visual positions — numbers are labels only, not to scale
const xA = 250;
const xB = 410;
const xC = 570;

// open circles slightly overrepresented
const OPEN_PROBABILITY = 0.60;

function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function isOpen(){ return Math.random() < OPEN_PROBABILITY; }

function getDistinctSortedNumbers(count){
  const set = new Set();
  while(set.size < count){
    set.add(randInt(-25,25));
  }
  return [...set].sort((a,b)=>a-b);
}

function el(type, attrs={}){
  const e = document.createElementNS("http://www.w3.org/2000/svg", type);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function clearGraph(){ svg.innerHTML=""; }

function drawBase(){
  svg.appendChild(el("line",{x1:axisLeft,y1:axisY,x2:axisRight,y2:axisY,stroke:"#111","stroke-width":3}));
  svg.appendChild(el("polygon",{points:`${axisLeft},${axisY} ${axisLeft+12},${axisY-7} ${axisLeft+12},${axisY+7}`,fill:"#111"}));
  svg.appendChild(el("polygon",{points:`${axisRight},${axisY} ${axisRight-12},${axisY-7} ${axisRight-12},${axisY+7}`,fill:"#111"}));
}

function drawLabel(x,text){
  const t = el("text",{x:x,y:120,"text-anchor":"middle","font-family":"Arial","font-size":22,fill:"#111"});
  t.textContent = text;
  svg.appendChild(t);
}

function drawEndpoint(x,closed){
  svg.appendChild(el("circle",{cx:x,cy:axisY,r:9,fill:closed?"#111":"#fff",stroke:"#111","stroke-width":3}));
}

function drawSegment(x1,x2){
  svg.appendChild(el("line",{x1:x1,y1:axisY,x2:x2,y2:axisY,stroke:"#111","stroke-width":10,"stroke-linecap":"butt"}));
}

function drawLeftRayArrow(){
  svg.appendChild(el("polygon",{points:`${axisLeft},${axisY} ${axisLeft+18},${axisY-10} ${axisLeft+18},${axisY+10}`,fill:"#111"}));
}

function drawRightRayArrow(){
  svg.appendChild(el("polygon",{points:`${axisRight},${axisY} ${axisRight-18},${axisY-10} ${axisRight-18},${axisY+10}`,fill:"#111"}));
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function fmtLeftInfinity(a,b,c,aClosed,bClosed){
  return `(-∞, ${a}${aClosed?"]":")"} ∪ ${bClosed?"[":"("}${b}, ${c}]`;
}

function fmtRightInfinity(a,b,c,bClosed,cClosed){
  return `[${a}, ${b}${bClosed?"]":")"} ∪ ${cClosed?"[":"("}${c}, ∞)`;
}

function fmtBothInfinity(a,b,aClosed,bClosed){
  return `(-∞, ${a}${aClosed?"]":")"} ∪ ${bClosed?"[":"("}${b}, ∞)`;
}

function makeProblem(){
  // exactly equal weighting among the three structures
  const type = ["left","right","both"][randInt(0,2)];

  if(type==="left"){
    const [a,b,c] = getDistinctSortedNumbers(3);
    const aClosed = !isOpen();
    const bClosed = !isOpen();

    const combos = [
      {ac:false, bc:false},
      {ac:true,  bc:false},
      {ac:false, bc:true},
      {ac:true,  bc:true}
    ];

    return {
      type,a,b,c,aClosed,bClosed,
      choices: shuffle(combos.map(o=>({
        text: fmtLeftInfinity(a,b,c,o.ac,o.bc),
        correct: o.ac===aClosed && o.bc===bClosed
      })))
    };
  }

  if(type==="right"){
    const [a,b,c] = getDistinctSortedNumbers(3);
    const bClosed = !isOpen();
    const cClosed = !isOpen();

    const combos = [
      {bc:false, cc:false},
      {bc:true,  cc:false},
      {bc:false, cc:true},
      {bc:true,  cc:true}
    ];

    return {
      type,a,b,c,bClosed,cClosed,
      choices: shuffle(combos.map(o=>({
        text: fmtRightInfinity(a,b,c,o.bc,o.cc),
        correct: o.bc===bClosed && o.cc===cClosed
      })))
    };
  }

  const [a,b] = getDistinctSortedNumbers(2);
  const aClosed = !isOpen();
  const bClosed = !isOpen();

  const combos = [
    {ac:false, bc:false},
    {ac:true,  bc:false},
    {ac:false, bc:true},
    {ac:true,  bc:true}
  ];

  return {
    type,a,b,aClosed,bClosed,
    choices: shuffle(combos.map(o=>({
      text: fmtBothInfinity(a,b,o.ac,o.bc),
      correct: o.ac===aClosed && o.bc===bClosed
    })))
  };
}

function drawProblem(p){
  clearGraph();
  drawBase();

  if(p.type==="left"){
    drawSegment(axisLeft,xA);
    drawLeftRayArrow();
    drawSegment(xB,xC);
    drawEndpoint(xA,p.aClosed);
    drawEndpoint(xB,p.bClosed);
    drawEndpoint(xC,true);
    drawLabel(xA,p.a);
    drawLabel(xB,p.b);
    drawLabel(xC,p.c);
  }
  else if(p.type==="right"){
    drawSegment(xA,xB);
    drawSegment(xC,axisRight);
    drawRightRayArrow();
    drawEndpoint(xA,true);
    drawEndpoint(xB,p.bClosed);
    drawEndpoint(xC,p.cClosed);
    drawLabel(xA,p.a);
    drawLabel(xB,p.b);
    drawLabel(xC,p.c);
  }
  else {
    drawSegment(axisLeft,xA);
    drawLeftRayArrow();
    drawSegment(xC,axisRight);
    drawRightRayArrow();
    drawEndpoint(xA,p.aClosed);
    drawEndpoint(xC,p.bClosed);
    drawLabel(xA,p.a);
    drawLabel(xC,p.b);
  }
}

function intervalMath(s){
  return "\\("+s.replace(/∞/g,"\\infty").replace(/∪/g,"\\cup")+"\\)";
}
function renderChoices(p){
  const radios=document.querySelectorAll('input[name="choice"]');
  p.choices.forEach((choice,i)=>{
    document.getElementById(`choiceText${i}`).innerHTML=intervalMath(choice.text);
    radios[i].checked=false;
    radios[i].disabled=false;
    radios[i].dataset.correct=choice.correct?"true":"false";
  });
  typesetMath(document.querySelector(".problem-box"));
}

function newProblem(){
  currentProblem=makeProblem();
  answered=false;
  feedback.textContent="";
  feedback.className="";
  document.getElementById("actionButton").textContent="Check Answer";
  drawProblem(currentProblem);
  renderChoices(currentProblem);
}

function checkAnswer(){
  if(answered) return;
  const selected=document.querySelector('input[name="choice"]:checked');
  if(!selected){
    feedback.textContent="Select an answer choice first.";
    feedback.className="incorrect";
    return;
  }

  attemptCount++;
  answered=true;

  if(selected.dataset.correct==="true"){
    correctCount++;
    feedback.textContent="Correct!";
    feedback.className="correct";
  } else {
    const answer=currentProblem.choices.find(c=>c.correct).text;
    feedback.textContent=`Not quite. Correct answer: ${answer}`;
    feedback.className="incorrect";
  }

  document.getElementById("correctCount").textContent=correctCount;
  document.getElementById("attemptCount").textContent=attemptCount;
  document.getElementById("actionButton").textContent="New Question";
}

document.getElementById("actionButton").addEventListener("click",()=>{
  answered ? newProblem() : checkAnswer();
});

document.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    answered ? newProblem() : checkAnswer();
  }
});

// Generate a fully functional first problem as soon as the page loads.
newProblem();
</script>
</body>
</html>
